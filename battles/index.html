<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle (戦闘結果アーカイブ) - 秘密結社の部屋</title>
    <!-- 共通CSSファイルの読み込み -->
    <link rel="stylesheet" href="../route.css">
    <!-- Battleページ専用CSSの読み込み -->
    <link rel="stylesheet" href="battles.css">
</head>
<body>

    <!-- ヘッダー読み込み用コンテナ -->
    <div id="header-container"></div>

    <div class="container">
        <h1 class="page-title">Battle (戦闘結果・大会ログアーカイブ)</h1>

        <!-- ガイドカード -->
        <div class="guide-card">
            <h2 class="guide-title">ℹ️ 戦闘結果の閲覧について</h2>
            <ul class="guide-list">
                <li>イベントごとに過去の対戦ログや大会結果をグルーピングして掲載しています。</li>
                <li>「詳細を見る」ボタンを押すと、それぞれの戦闘詳細ページ（個別HTML）に移動します。</li>
            </ul>
        </div>

        <!-- イベント別 戦闘結果一覧エリア -->
        <div class="event-section">
            <h2 class="section-title" style="margin-bottom: 15px;">📋 イベント別 戦闘結果一覧</h2>
            <div id="loading-msg">データを読み込み中...</div>
            <div id="event-container">
                <!-- ここに battles.js によって動的にデータが挿入されます -->
            </div>
        </div>
    </div>

    <!-- ヘッダーを読み込むためのスクリプト（サブフォルダ対応版：../header.html を取得） -->
    <script>
        fetch('../header.html')
            .then(response => {
                if (!response.ok) throw new Error('ヘッダー読み込み失敗');
                return response.text();
            })
            .then(data => {
                const container = document.getElementById('header-container');
                if (container) {
                    container.innerHTML = data;
                    
                    const pathParts = window.location.pathname.split('/').filter(Boolean);
                    const currentFolder = pathParts[pathParts.length - 1] || '';

                    const navLinks = document.querySelectorAll('.nav-links a');
                    navLinks.forEach(link => {
                        const href = link.getAttribute('href') || '';
                        if (href.includes(`/${currentFolder}/`) || href.includes(`/${currentFolder}`)) {
                            link.classList.add('active');
                        }
                    });
                }
            })
            .catch(err => console.log("ヘッダー読み込みスキップ: ", err));
    </script>

    <!-- 1. データファイルを読み込む -->
    <script src="battles-data.js"></script>
    <!-- 2. 描画・制御用スクリプトファイルを読み込む -->
    <script src="battles.js"></script>
</body>
</html>
