<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangar - 秘密結社の部屋</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/fixedcolumns/4.3.0/css/fixedColumns.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/fixedcolumns/4.3.0/js/dataTables.fixedColumns.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <!-- 専用のCSSファイルを読み込み -->
    <link rel="stylesheet" href="hangar.css">
</head>
<body>

<div id="overlay">SYNCING SYSTEM...</div>

<!-- ▼ 共通ヘッダーが自動でここに読み込まれます -->
<div id="header-container" style="width: 100%;"></div>

<div class="control-panel">
    <div class="tab-wrapper" id="memberTabs"></div>
    <input type="text" id="search-box" placeholder="機体名や武装で検索...">
</div>

<div class="main-content">
    <table id="hangarTable" class="display nowrap" style="width:100%">
        <thead id="tableHeader"></thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<!-- 共通ヘッダーを読み込んで現在地をアクティブにする処理 -->
<script>
    fetch('header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header-container').innerHTML = data;
            
            // 現在開いているページを自動判定してナビに active クラスをつける
            const currentPath = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll('.nav-links a');
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
</script>

<!-- 専用のJavaScriptファイルを読み込み -->
<script src="hangar.js"></script>

<script data-goatcounter="https://bobs-base.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
