<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Trivia - 秘密結社の部屋</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mark.js/8.11.1/jquery.mark.min.js"></script>

    <style>
        :root {
            --bg-color: #1a1c1e;
            --accent-color: #00d4ff;
            --text-color: #e0e0e0;
            --card-bg: #25282c;
            --border-color: #444;
            --header-total-height: 200px;
        }

        html, body {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; font-family: sans-serif;
        }

        .nav-item-custom {
            color: #e0e0e0; text-decoration: none; font-size: 0.85rem; 
            padding: 6px 10px; border-radius: 4px; border: 1px solid transparent;
            transition: 0.2s;
        }
        .nav-item-custom:hover, .nav-item-custom.active { 
            background: rgba(0, 212, 255, 0.2); 
            border-color: #00d4ff; 
        }

        /* 上部固定エリア */
        .top-section {
            background: var(--bg-color);
            border-bottom: 2px solid var(--accent-color);
            padding: 10px 20px 0 20px; box-sizing: border-box;
            z-index: 100;
        }

        .search-area { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
        #search-box {
            flex-grow: 1; padding: 10px; background: #222; 
            border: 1px solid var(--accent-color); color: white; border-radius: 4px;
            max-width: 500px;
        }

        /* タブデザイン（2行折り返し対応） */
        .tabs-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding-bottom: 5px;
        }

        .tab-btn {
            padding: 8px 14px; background: #333; border: none;
            color: var(--text-color); cursor: pointer; border-radius: 4px 4px 0 0;
            font-size: 0.85rem; transition: 0.2s;
        }
        .tab-btn.active { background: var(--accent-color); color: #000; font-weight: bold; }

        /* メインコンテンツ */
        .main-content {
            height: calc(100% - var(--header-total-height));
            overflow-y: auto; padding: 20px; box-sizing: border-box;
            background: var(--bg-color);
        }

        .info-box {
            background: var(--card-bg); padding: 25px; 
            border-left: 4px solid var(--accent-color); 
            line-height: 1.8; white-space: pre-wrap; 
            font-family: "MS Gothic", "Osaka-mono", monospace;
            font-size: 0.95rem; min-height: 100%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* 豆知識用の行ごとのカード風レイアウト・色分け */
        .trivia-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #2a2e33;
            border-radius: 6px;
            border-left: 3px solid var(--accent-color);
            transition: background 0.2s;
        }
        /* 交互に背景色を微調整して見やすくする */
        .trivia-item:nth-child(even) {
            background: #22262b;
        }
        .trivia-item:hover {
            background: rgba(0, 212, 255, 0.08);
        }

        mark { background: #ffeb3b; color: #000; padding: 0 2px; border-radius: 2px; }
    </style>
</head>
<body>

<!-- ▼ 共通ヘッダーが自動でここに読み込まれます -->
<div id="header-container"></div>

<div class="top-section">
    <div class="search-area">
        <input type="text" id="search-box" placeholder="表示中のテキスト内を検索...">
    </div>
    <div class="tabs-container" id="tabs-container"></div>
</div>

<div class="main-content" id="scroll-container">
    <div id="content-display" class="info-box">読み込み中...</div>
</div>

<!-- 共通ヘッダーを読み込んで現在地をアクティブにする処理 -->
<script>
    fetch('header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header-container').innerHTML = data;
            
            // 現在開いているページを自動判定してナビに active クラスをつける
            const currentPath = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll('.nav-links a');
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
</script>

<script>
$(document).ready(function () {
    // ファイルの参照先を「trivia/」フォルダ内に変更
    const triviaFiles = [
        { name: "遊び方", file: "trivia/「MSタクティクスSR」_の遊び方.txt" },
        { name: "Q&A", file: "trivia/Q&A（公式転載）.txt" },
        { name: "キャラステータス", file: "trivia/キャラステータス.txt" },
        { name: "機体ステータス", file: "trivia/機体ステータス.txt" },
        { name: "改造・熟練度", file: "trivia/機体カスタマイズ・熟練度.txt" },
        { name: "スキル", file: "trivia/スキル.txt" },
        { name: "特性", file: "trivia/特性一覧.txt" },
        { name: "地形", file: "trivia/地形.txt" },
        { name: "戦闘ダメージ", file: "trivia/戦闘ダメージ.txt" },
        { name: "索敵", file: "trivia/索敵.txt" },
        { name: "気力", file: "trivia/気力.txt" },
        { name: "掃討盤", file: "trivia/掃討盤.txt" },
        { name: "豆知識", file: "trivia/豆知識.txt" }
    ];

    const $content =$('#content-display');
    const $search =$('#search-box');

    // タブ生成
    triviaFiles.forEach((item) => {
        const $btn =$('<button class="tab-btn"></button>')
            .text(item.name)
            .on('click', function() {
                $('.tab-btn').removeClass('active');$(this).addClass('active');
                loadContent(item.file);
            });
        $('#tabs-container').append($btn);
    });

    $('.tab-btn').first().click();

    function loadContent(filePath) {
        $content.text("読み込み中...");
        
        fetch(filePath)
            .then(response => response.arrayBuffer())
            .then(buffer => {
                let text = new TextDecoder('utf-8').decode(buffer);
                if (text.includes('\uFFFD')) {
                    text = new TextDecoder('shift-jis').decode(buffer);
                }
                
                displayContent(filePath, text);
            })
            .catch(err => {
                $content.text("エラー: ファイルが読み込めませんでした。");
            });
    }

    function displayContent(filePath, text) {
        // 「trivia/豆知識.txt」のときだけ行ごとに分割してカード風レイアウトにする
        if (filePath.endsWith("豆知識.txt")) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            const htmlLines = lines.map((line) => {
                const escaped = $('<div>').text(line).html();
                return `<div class="trivia-item">${escaped}</div>`;
            });
            $content.html(htmlLines.join(''));
        } else {
            $content.text(text);
        }

        applyHighlight();
        $('#scroll-container').scrollTop(0);
    }

    $search.on('input', applyHighlight);

    function applyHighlight() {
        const keyword = $search.val();$content.unmark().mark(keyword, { "accuracy": "partially" });
    }
});
</script>
<script data-goatcounter="https://bobs-base.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
