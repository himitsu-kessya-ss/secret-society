<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勢力P管理 - 秘密結社の部屋</title>
    <style>
        :root {
            --bg-color: #1a1c1e;
            --card-bg: #25282c;
            --accent-color: #00d4ff;
            --text-color: #e0e0e0;
            --sub-text: #a0a0a0;
            --header-height: 60px;
            --border-color: #333;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: rgba(0, 0, 0, 0.95);
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--accent-color);
            padding: 0 15px;
            box-sizing: border-box;
        }

        .logo-link {
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent-color);
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .nav-links::-webkit-scrollbar { display: none; }

        .nav-item-custom {
            color: #e0e0e0; text-decoration: none; font-size: 0.85rem; 
            padding: 6px 10px; border-radius: 4px; border: 1px solid transparent;
            transition: 0.2s;
        }
        .nav-item-custom:hover { background: rgba(0, 212, 255, 0.2); border-color: #00d4ff; }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 40px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            color: var(--sub-text);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .sheet-btn {
            display: inline-block;
            background-color: #0f9d58; /* Googleスプレッドシート風のグリーン */
            color: #fff;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(15, 157, 88, 0.3);
        }

        .sheet-btn:hover {
            background-color: #12b765;
            box-shadow: 0 6px 15px rgba(15, 157, 88, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <header id="main-header">
        <a href="index.html#main" class="logo-link">秘密結社の部屋</a>
        <nav class="nav-links">
            <a href="unit.html" class="nav-item-custom">Unit</a>
            <a href="derivatives.html" class="nav-item-custom">Derivatives</a>
            <a href="arms.html" class="nav-item-custom">Arms</a>
            <a href="hangar.html" class="nav-item-custom">Hangar</a>
            <a href="seiryoku-p.html" class="nav-item-custom" style="color: var(--accent-color); border-color: var(--accent-color);">勢力P管理</a>
            <a href="upload.html" class="nav-item-custom">Upload</a>
            <a href="novels.html" class="nav-item-custom">Novels</a>
            <a href="tactics.html" class="nav-item-custom">Tactics</a>
            <a href="hunter.html" class="nav-item-custom">Hunter</a>
            <a href="trivia.html" class="nav-item-custom">Trivia</a>
            <a href="emoji.html" class="nav-item-custom">Emoji</a>
        </nav>
    </header>

    <div class="container">
        <div class="card">
            <h2>📊 勢力P管理スプレッドシート</h2>
            <p>勢力Pの管理やイベントログの入力は、専用のGoogleスプレッドシートで行っています。<br>下のボタンよりスプレッドシートを開いてご確認ください。</p>
            
            <a href="https://docs.google.com/spreadsheets/d/1Ueybp-sH48cHnEE-K6RRCASlIWwE1iyjHzUtUx4Qj3A/edit?gid=119354537#gid=119354537" target="_blank" class="sheet-btn">
                📈 スプレッドシートを開く
            </a>
        </div>
    </div>

</body>
</html>
