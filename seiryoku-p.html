<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勢力P管理 - 秘密結社の部屋</title>
    <style>
        :root {
            --bg-color: #1a1c1e;
            --card-bg: #25282c;
            --accent-color: #00d4ff;
            --text-color: #e0e0e0;
            --sub-text: #a0a0a0;
            --header-height: 60px;
            --border-color: #333;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 40px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        h2 {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin-top: 0;
            margin-bottom: 15px;
        }

        p {
            color: var(--sub-text);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .sheet-btn {
            display: inline-block;
            background-color: #0f9d58; /* Googleスプレッドシート風のグリーン */
            color: #fff;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(15, 157, 88, 0.3);
        }

        .sheet-btn:hover {
            background-color: #12b765;
            box-shadow: 0 6px 15px rgba(15, 157, 88, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- ▼ 共通ヘッダーが自動でここに読み込まれます -->
    <div id="header-container"></div>

    <div class="container">
        <div class="card">
            <h2>📊 勢力P管理スプレッドシート</h2>
            <p>勢力Pの管理やイベントログの入力は、専用のGoogleスプレッドシートで行っています。<br>下のボタンよりスプレッドシートを開いてご確認ください。</p>
            
            <a href="https://docs.google.com/spreadsheets/d/1Ueybp-sH48cHnEE-K6RRCASlIWwE1iyjHzUtUx4Qj3A/edit?gid=119354537#gid=119354537" target="_blank" class="sheet-btn">
                📈 スプレッドシートを開く
            </a>
        </div>
    </div>

    <!-- 共通ヘッダーを読み込んで現在地をアクティブにする処理 -->
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
                
                // 現在開いているページを自動判定してナビに active クラスをつける
                const currentPath = window.location.pathname.split('/').pop();
                const navLinks = document.querySelectorAll('.nav-links a');
                navLinks.forEach(link => {
                    if (link.getAttribute('href') === currentPath) {
                        link.classList.add('active');
                    }
                });
            });
    </script>

</body>
</html>
