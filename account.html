<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アカウント管理 - 秘密結社の部屋</title>
    <style>
        :root {
            --bg-color: #1a1c1e;
            --card-bg: #25282c;
            --accent-color: #00d4ff;
            --admin-color: #ff9900;
            --text-color: #e0e0e0;
            --sub-text: #a0a0a0;
            --header-height: 60px;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: rgba(0, 0, 0, 0.95);
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--accent-color);
            padding: 0 15px;
            box-sizing: border-box;
        }

        .logo-link {
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent-color);
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .nav-links::-webkit-scrollbar { display: none; }

        .nav-item-custom {
            color: #e0e0e0; text-decoration: none; font-size: 0.85rem; 
            padding: 6px 10px; border-radius: 4px; border: 1px solid transparent;
            transition: 0.2s;
        }
        .nav-item-custom:hover { background: rgba(0, 212, 255, 0.2); border-color: #00d4ff; }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h2 {
            color: var(--accent-color);
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h2.admin-title {
            color: var(--admin-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--sub-text);
            margin-bottom: 5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #1a1c1e;
            border: 1px solid #444;
            border-radius: 4px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-color);
        }

        .btn {
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            border: 1px solid;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-primary {
            background: transparent;
            color: var(--accent-color);
            border-color: var(--accent-color);
        }
        .btn-primary:hover {
            background: rgba(0, 212, 255, 0.1);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .btn-admin {
            background: transparent;
            color: var(--admin-color);
            border-color: var(--admin-color);
        }
        .btn-admin:hover {
            background: rgba(255, 153, 0, 0.1);
            box-shadow: 0 0 10px rgba(255, 153, 0, 0.3);
        }

        .btn-danger {
            background: transparent;
            color: #ff5555;
            border-color: #ff5555;
        }
        .btn-danger:hover {
            background: rgba(255, 85, 85, 0.1);
            box-shadow: 0 0 10px rgba(255, 85, 85, 0.3);
        }

        .error-message {
            color: #ff5555;
            font-size: 0.85rem;
            margin-top: 8px;
            display: none;
        }

        /* アカウント一覧テーブル */
        .account-table-container {
            overflow-x: auto;
            margin-top: 15px;
        }

        .account-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        .account-table th, .account-table td {
            padding: 10px;
            border-bottom: 1px solid #333;
            vertical-align: middle;
        }

        .account-table th {
            color: var(--sub-text);
            background: #1a1c1e;
            white-space: nowrap;
        }

        .account-table input, .account-table select {
            background: #1a1c1e;
            border: 1px solid #444;
            color: var(--text-color);
            padding: 6px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            font-size: 0.85rem;
        }

        /* 認証オーバーレイ */
        #auth-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 28, 30, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .auth-card {
            background: var(--card-bg);
            border: 2px solid var(--admin-color);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            box-sizing: border-box;
            text-align: center;
        }

        #protected-content {
            display: none;
        }
    </style>
</head>
<body>

    <!-- 共通ヘッダー -->
    <header id="main-header">
        <a href="index.html#main" class="logo-link">秘密結社の部屋</a>
        <nav class="nav-links">
            <a href="unit.html" class="nav-item-custom">Unit</a>
            <a href="derivatives.html" class="nav-item-custom">Derivatives</a>
            <a href="arms.html" class="nav-item-custom">Arms</a>
            <a href="hangar.html" class="nav-item-custom">Hangar</a>
            <a href="seiryoku-p.html" class="nav-item-custom" style="color: var(--accent-color); border-color: var(--accent-color);">勢力P管理</a>
            <a href="upload.html" class="nav-item-custom">Upload</a>
            <a href="#" class="nav-item-custom">Battle</a>
            <a href="novels.html" class="nav-item-custom">Novels</a>
            <a href="tactics.html" class="nav-item-custom">Tactics</a>
            <a href="hunter.html" class="nav-item-custom">Hunter</a>
            <a href="trivia.html" class="nav-item-custom">Trivia</a>
            <a href="emoji.html" class="nav-item-custom">Emoji</a>
            <a href="account.html" class="nav-item-custom" style="border-color: var(--accent-color);">Account</a>
            <a href="#" class="nav-item-custom">Link</a>
        </nav>
    </header>

    <!-- 管理者認証画面 -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2 class="admin-title" style="margin-bottom: 15px; font-size: 1.3rem;">🔒 管理者認証が必要です</h2>
            <p style="color: var(--sub-text); font-size: 0.85rem; margin-bottom: 20px;">
                アカウント管理ページにアクセスするには、管理者パスワードの入力が必要です。
            </p>
            <form id="page-auth-form" onsubmit="verifyPageAdmin(event)">
                <div class="form-group" style="text-align: left;">
                    <label for="page-admin-pw">管理者パスワード</label>
                    <input type="password" id="page-admin-pw" placeholder="パスワードを入力" required>
                </div>
                <div id="page-auth-error" class="error-message">パスワードが違います</div>
                <button type="submit" class="btn btn-admin" style="width: 100%; margin-top: 10px;">認証して入室する</button>
            </form>
            <div style="margin-top: 15px;">
                <a href="index.html#main" style="color: var(--sub-text); font-size: 0.8rem; text-decoration: none;">← トップページに戻る</a>
            </div>
        </div>
    </div>

    <!-- 認証成功後のメインコンテンツ -->
    <div id="protected-content" class="container">
        
        <!-- 1. 新規アカウント発行カード（並び：ID, PW, キャラ名, 権限, メモ） -->
        <div class="card">
            <h2 class="admin-title">➕ 新規アカウント発行</h2>
            <form id="create-account-form" onsubmit="createAccount(event)">
                <div class="form-group">
                    <label for="new-id">アカウント ID</label>
                    <input type="text" id="new-id" placeholder="半角英数字など（例: pilot2）" required>
                </div>
                <div class="form-group">
                    <label for="new-pw">パスワード (PW)</label>
                    <input type="text" id="new-pw" placeholder="パスワードを入力" required>
                </div>
                <div class="form-group">
                    <label for="new-charaname">キャラクター名</label>
                    <input type="text" id="new-charaname" placeholder="ゲーム内や掲示板での表示名">
                </div>
                <div class="form-group">
                    <label for="new-role">権限レベル</label>
                    <select id="new-role">
                        <option value="一般">一般</option>
                        <option value="管理者">管理者</option>
                        <option value="ゲスト">ゲスト</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="new-memo">メモ</label>
                    <input type="text" id="new-memo" placeholder="用途や担当者名など">
                </div>
                <button type="submit" class="btn btn-admin">アカウントを発行する</button>
            </form>
        </div>

        <!-- 2. アカウント一覧カード（並び：ID, PW, キャラ名, 権限, メモ, 最終更新日） -->
        <div class="card">
            <h2>📜 登録アカウント一覧（編集・削除）</h2>
            <p style="font-size: 0.85rem; color: var(--sub-text);">
                各項目を直接書き換えて「保存」ボタンを押すと、最終更新日時が自動更新されます。
            </p>
            <div class="account-table-container">
                <table class="account-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>PW</th>
                            <th>キャラクター名</th>
                            <th>権限レベル</th>
                            <th>メモ</th>
                            <th>最終更新日</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="account-list-tbody">
                        <!-- JavaScriptで動的に生成されます -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 3. 退出・ログアウトボタン -->
        <div style="display: flex; gap: 15px; justify-content: flex-end;">
            <button type="button" class="btn btn-primary" onclick="lockAndExit()">管理画面をロックして退出</button>
            <button type="button" class="btn btn-danger" onclick="logout()">完全ログアウト</button>
        </div>
    </div>

    <!-- 外部スクリプトの読み込み -->
    <script src="account-data.js"></script>
    <script src="account-logic.js"></script>
    <script data-goatcounter="https://bobs-base.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
