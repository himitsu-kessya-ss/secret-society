<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Management - 秘密結社の部屋</title>
    <style>
        :root {
            --bg-color: #1a1c1e;
            --card-bg: #25282c;
            --accent-color: #00d4ff;
            --text-color: #e0e0e0;
            --sub-text: #a0a0a0;
            --header-height: 60px;
        }

        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: rgba(0, 0, 0, 0.95);
            height: var(--header-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--accent-color);
            padding: 0 15px;
            box-sizing: border-box;
        }

        .logo-link {
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent-color);
            white-space: nowrap;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .nav-links::-webkit-scrollbar { display: none; }

        .nav-item-custom {
            color: #e0e0e0; text-decoration: none; font-size: 0.85rem; 
            padding: 6px 10px; border-radius: 4px; border: 1px solid transparent;
            transition: 0.2s;
        }
        .nav-item-custom:hover, .nav-item-custom.active { 
            background: rgba(0, 212, 255, 0.2); 
            border-color: #00d4ff; 
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 30px auto;
            padding: 20px;
            box-sizing: border-box;
        }

        .page-title {
            color: var(--accent-color);
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--sub-text);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background: #1a1c1e;
            border: 1px solid #444;
            border-radius: 4px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--accent-color);
        }

        /* アバタープレビュー */
        .avatar-preview-box {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            background: #1a1c1e;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        .avatar-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #000;
            border: 2px solid var(--accent-color);
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            overflow: hidden;
            flex-shrink: 0;
        }
        .avatar-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .save-btn {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .save-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
        }

        .success-msg {
            color: #00ffcc;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html#main" class="logo-link">秘密結社の部屋</a>
        <nav class="nav-links">
            <a href="unit.html" class="nav-item-custom" style="display: none;">Unit</a>
            <a href="derivatives.html" class="nav-item-custom">Derivatives</a>
            <a href="arms.html" class="nav-item-custom">Arms</a>
            <a href="hangar.html" class="nav-item-custom" style="display: none;">Hangar</a>
            <a href="seiryoku-p.html" class="nav-item-custom" style="color: var(--accent-color); border-color: var(--accent-color);">勢力P管理</a>
            <a href="upload.html" class="nav-item-custom">Upload</a>
            <a href="#" class="nav-item-custom">Battle</a>
            <a href="novels.html" class="nav-item-custom">Novels</a>
            <a href="bbs.html" class="nav-item-custom">秘密結社BBS</a>
            <a href="hunter.html" class="nav-item-custom">Hunter</a>
            <a href="trivia.html" class="nav-item-custom">Trivia</a>
            <a href="emoji.html" class="nav-item-custom">Emoji</a>
            <a href="account.html" class="nav-item-custom active">Account</a>
            <a href="#" class="nav-item-custom">Link</a>
        </nav>
    </header>

    <div class="container">
        <h1 class="page-title">⚙️ プレイヤーアカウント設定</h1>

        <div class="card">
            <div class="form-group">
                <label>現在の顔アイコン プレビュー</label>
                <div class="avatar-preview-box">
                    <div class="avatar-img" id="preview-container">👤</div>
                    <div style="font-size: 0.85rem; color: var(--sub-text);">
                        ※登録された画像URL、または自動生成アイコンが表示されます。
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="nameInput">プレイヤー名（キャラクター名）</label>
                <input type="text" id="nameInput" placeholder="名前を入力">
            </div>

            <div class="form-group">
                <label for="avatarInput">顔アイコン画像URL（任意）</label>
                <input type="text" id="avatarInput" placeholder="https://example.com/icon.png など" oninput="updatePreview()">
                <div style="font-size: 0.75rem; color: var(--sub-text); margin-top: 4px;">※画像のアドレスを入力すると、アイコンとして反映されます。空欄の場合は自動アイコンになります。</div>
            </div>

            <button class="save-btn" onclick="saveAccountSettings()">設定を保存する</button>
            <div id="successMsg" class="success-msg">設定を保存しました！</div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const savedData = JSON.parse(localStorage.getItem('secret_user_account'));
            const loginUserName = sessionStorage.getItem('loginUserName') || '名無しパイロット';
            const loginUserId = sessionStorage.getItem('loginUserId') || 'secret';

            const nameInput = document.getElementById('nameInput');
            const avatarInput = document.getElementById('avatarInput');

            if (savedData) {
                nameInput.value = savedData.name || loginUserName;
                avatarInput.value = savedData.avatar || '';
            } else {
                nameInput.value = loginUserName;
                avatarInput.value = '';
            }
            updatePreview();
        };

        function updatePreview() {
            const avatarInputVal = document.getElementById('avatarInput').value.trim();
            const previewContainer = document.getElementById('preview-container');
            const loginUserId = sessionStorage.getItem('loginUserId') || 'secret';

            const defaultAvatar = 'https://api.dicebear.com/7.x/pixel-art/svg?seed=' + loginUserId;
            const targetAvatar = avatarInputVal !== '' ? avatarInputVal : defaultAvatar;

            previewContainer.innerHTML = `<img src="${targetAvatar}" alt="Avatar" onerror="this.onerror=null; this.parentNode.innerHTML='👤';">`;
        }

        function saveAccountSettings() {
            const nameVal = document.getElementById('nameInput').value.trim();
            const avatarVal = document.getElementById('avatarInput').value.trim();

            if (!nameVal) {
                alert('プレイヤー名を入力してください。');
                return;
            }

            const accountData = {
                name: nameVal,
                avatar: avatarVal
            };

            localStorage.setItem('secret_user_account', JSON.stringify(accountData));
            sessionStorage.setItem('loginUserName', nameVal); // セッション側も同期

            const successMsg = document.getElementById('successMsg');
            successMsg.style.display = 'block';
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
