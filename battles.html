<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battle (戦闘結果アーカイブ) - 秘密結社の部屋</title>
    <!-- 共通CSSファイルの読み込み -->
    <link rel="stylesheet" href="upload.css">
    <style>
        /* ヘッダー専用のスタイル */
        header {
            background-color: rgba(0, 0, 0, 0.95);
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #00d4ff;
            padding: 0 15px;
            box-sizing: border-box;
        }
        .logo-link {
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1rem;
            color: #00d4ff;
            white-space: nowrap;
        }
        .nav-links {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .nav-links::-webkit-scrollbar { display: none; }
        .nav-item-custom {
            color: #e0e0e0; 
            text-decoration: none; 
            font-size: 0.85rem; 
            padding: 6px 10px; 
            border-radius: 4px; 
            border: 1px solid transparent;
            transition: 0.2s;
        }
        .nav-item-custom:hover, .nav-item-custom.active { 
            background: rgba(0, 212, 255, 0.2); 
            border-color: #00d4ff; 
        }

        /* アーカイブ閲覧ページ固有のスタイル */
        .event-section {
            margin-bottom: 25px;
        }
        .event-card {
            background: var(--card-bg, #161b22);
            border: 1px solid #333;
            border-radius: 8px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: 0.2s;
        }
        .event-header {
            background: #1f2328;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border-left: 4px solid var(--accent-color, #00d4ff);
        }
        .event-title {
            font-size: 1.1rem;
            color: var(--accent-color, #00d4ff);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .event-body {
            padding: 15px 20px;
            border-top: 1px solid #333;
            background: rgba(0, 0, 0, 0.15);
        }
        .sub-battle-item {
            background: #1a1c1e;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: 0.2s;
        }
        .sub-battle-item:hover {
            border-color: var(--accent-color, #00d4ff);
            background: rgba(0, 212, 255, 0.05);
        }
        .sub-battle-info {
            flex: 1;
        }
        .sub-battle-title {
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 4px;
            font-size: 0.95rem;
        }
        .sub-battle-desc {
            font-size: 0.85rem;
            color: var(--sub-text, #8b949e);
        }
        .view-btn {
            background: transparent;
            color: var(--accent-color, #00d4ff);
            border: 1px solid var(--accent-color, #00d4ff);
            padding: 6px 14px;
            font-size: 0.85rem;
            border-radius: 4px;
            text-decoration: none;
            transition: 0.2s;
            white-space: nowrap;
        }
        .view-btn:hover {
            background: rgba(0, 212, 255, 0.2);
            box-shadow: 0 0 6px rgba(0, 212, 255, 0.4);
            color: #fff;
        }
        #loading-msg {
            text-align: center;
            color: var(--sub-text, #8b949e);
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- ヘッダー読み込み用コンテナ -->
    <div id="header-container"></div>

    <div class="container">
        <h1 class="page-title">Battle (戦闘結果・大会ログアーカイブ)</h1>

        <!-- ガイドカード -->
        <div class="guide-card">
            <h2 class="guide-title">ℹ️ 戦闘結果の閲覧について</h2>
            <ul class="guide-list">
                <li>イベントごとに過去の対戦ログや大会結果をグルーピングして掲載しています。</li>
                <li>「詳細を見る」ボタンを押すと、それぞれの戦闘詳細ページ（個別HTML）に移動します。</li>
            </ul>
        </div>

        <!-- イベント別 戦闘結果一覧エリア -->
        <div class="event-section">
            <h2 class="section-title" style="margin-bottom: 15px;">📋 イベント別 戦闘結果一覧</h2>
            <div id="loading-msg">データを読み込み中...</div>
            <div id="event-container">
                <!-- ここに battles.js によって動的にデータが挿入されます -->
            </div>
        </div>
    </div>

    <!-- ヘッダーを読み込むためのスクリプト -->
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
            });
    </script>

    <!-- 1. データファイルを読み込む -->
    <script src="battles-data.js"></script>
    <!-- 2. 描画・制御用スクリプトファイルを読み込む -->
    <script src="battles.js"></script>
</body>
</html>
