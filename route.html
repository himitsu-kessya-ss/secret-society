<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>機体派生ルート検索・総コストシミュレーター</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #c0d2ec;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            border-bottom: 2px solid #3a506b;
            padding-bottom: 10px;
            font-size: 22px;
            letter-spacing: 1px;
            display: inline-block;
            background: #111a2e;
            padding: 10px 20px;
            border: 1px solid #2b4c7e;
        }
        p {
            font-size: 14px;
            color: #8da4c4;
        }
        .search-box {
            background: #131c31;
            border: 1px solid #2b4c7e;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        input[type="text"] {
            background: #070b14;
            border: 1px solid #3a506b;
            color: #fff;
            padding: 8px 12px;
            font-size: 16px;
            width: 300px;
            margin-right: 10px;
        }
        button {
            background: #1e3a60;
            color: #fff;
            border: 1px solid #4a75ab;
            padding: 9px 20px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #284e80;
        }
        .log-box {
            background: #1a1215;
            border: 1px dashed #7e3a3a;
            padding: 10px 15px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #e8a0a0;
            line-height: 1.5;
        }
        .route-display {
            background: #111a2e;
            border: 1px solid #2b4c7e;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #64b5f6;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #0d1424;
            margin-top: 10px;
            font-size: 13px;
        }
        th, td {
            border: 1px solid #223454;
            padding: 8px 4px;
            text-align: center;
        }
        th {
            background: #14223d;
            color: #8ab4f8;
            font-size: 12px;
        }
        td.name-col {
            text-align: left;
            padding-left: 8px;
        }
        .total-box {
            background: #131c31;
            border: 1px solid #2b4c7e;
            padding: 15px 20px;
            margin-top: 20px;
        }
        .total-box h3 {
            margin-top: 0;
            color: #64b5f6;
            font-size: 16px;
        }
        .total-value {
            font-size: 18px;
            font-weight: bold;
            color: #ffca28;
        }
    </style>
</head>
<body>

    <h1>機体派生ルート検索・総コストシミュレーター</h1>
    <p>作りたい最終機体の名前を検索すると、CSVデータから自動でルートを読み込んで計算します。</p>

    <div class="search-box">
        <label for="searchInput">最終機体名で検索：</label>
        <input type="text" id="searchInput" placeholder="例: ドリテア、ボール改 など" onkeypress="handleKeyPress(event)">
        <button onclick="searchRoute()">検索・計算</button>
    </div>

    <div class="log-box" id="logBox">
        【動作確認ログ】<br>
        CSVファイルを読み込んでいます...
    </div>

    <div class="route-display" id="routeDisplay">
        派生ルート：未検索
    </div>

    <h2>ルート構成・機体詳細と個別コスト</h2>
    
    <div style="overflow-x: auto;">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>No</th>
                    <th>機体名</th>
                    <th>変形</th>
                    <th>HP</th>
                    <th>装甲</th>
                    <th>運動</th>
                    <th>索敵</th>
                    <th>EN</th>
                    <th>重量</th>
                    <th>直感</th>
                    <th>操縦</th>
                    <th>近</th>
                    <th>中</th>
                    <th>遠</th>
                    <th>名声</th>
                    <th>NT</th>
                    <th>SIZE</th>
                    <th>コスト</th>
                    <th>クレジット</th>
                    <th>地上</th>
                    <th>水中</th>
                    <th>宇宙</th>
                    <th>空中</th>
                    <th>種別</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="24" style="padding: 20px; color: #8da4c4;">準備完了しました。上の検索窓に機体名を入力して検索してください。</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="total-box">
        <h3>▼ 派生ルート総合計コスト</h3>
        <p>累計必要クレジット： <span class="total-value" id="totalCredit">0</span> クレジット</p>
        <p>累計必要名声： <span class="total-value" id="totalFame">0</span> 名声</p>
    </div>

    <script>
        const MECH_CSV = "route/GL)機体一覧 - 機体一覧.csv";
        const ROUTE_CSV = "route/GL)機体派生ルート_260924 - 派生ルート.csv";

        let mechDataList = []; 
        let routeData = [];    

        window.onload = function() {
            Promise.all([
                fetch(MECH_CSV).then(res => res.text()),
                fetch(ROUTE_CSV).then(res => res.text())
            ])
            .then(([mechCsv, routeCsv]) => {
                mechDataList = parseCSV(mechCsv);
                routeData = parseCSV(routeCsv);

                // 新しい仕様に基づき、ヘッダー行を除いてデータがある行を正しくカウントする
                // インデックス2（目的派生検索の列）に文字があり、かつヘッダーの「目的派生検索」ではないもの
                let validRouteRows = routeData.filter(row => row.length > 2 && row[2] !== "" && row[2] !== "目的派生検索");

                document.getElementById("logBox").innerHTML = 
                    `【動作確認ログ】<br><span style="color:#69f0ae;">読み込み成功！</span> 機体一覧: ${mechDataList.length}件 / 派生ルート: ${validRouteRows.length}件`;
            })
            .catch(error => {
                document.getElementById("logBox").innerHTML = 
                    `【動作確認ログ】<br><span style="color:#ff6b6b;">読み込みエラー: ${error.message}</span>`;
            });
        };

        // ダブルクォーテーション内のカンマを保護しつつ、全行を確実に配列化するパーサー
        function parseCSV(text) {
            let rows = [];
            let currentRow = [];
            let currentVal = "";
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                let nextChar = text[i + 1];

                if (char === '"') {
                    if (inQuotes && nextChar === '"') {
                        currentVal += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (char === ',' && !inQuotes) {
                    currentRow.push(currentVal.trim());
                    currentVal = "";
                } else if ((char === '\r' && nextChar === '\n') && !inQuotes) {
                    currentRow.push(currentVal.trim());
                    rows.push(currentRow);
                    currentRow = [];
                    currentVal = "";
                    i++;
                } else if (char === '\n' && !inQuotes) {
                    currentRow.push(currentVal.trim());
                    rows.push(currentRow);
                    currentRow = [];
                    currentVal = "";
                } else {
                    currentVal += char;
                }
            }
            if (currentVal !== "" || currentRow.length > 0) {
                currentRow.push(currentVal.trim());
                rows.push(currentRow);
            }

            return rows.filter(row => row.length > 0 && row.some(val => val !== ""));
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                searchRoute();
            }
        }

        function searchRoute() {
            if (mechDataList.length === 0 || routeData.length === 0) {
                alert("まだデータの読み込みが完了していません。");
                return;
            }

            const keyword = document.getElementById("searchInput").value.trim();
            if (!keyword) {
                alert("検索する機体名を入力してください。");
                return;
            }

            // 新仕様：インデックス2（目的派生検索の列）がキーワードと完全に一致する行を探索
            let targetRow = null;
            for (let i = 0; i < routeData.length; i++) {
                let row = routeData[i];
                if (row[2] && row[2] === keyword) {
                    targetRow = row;
                    break;
                }
            }

            // 見つからない場合は、ルート内のどこかにその機体名が含まれていないか柔軟に探す
            if (!targetRow) {
                for (let i = 0; i < routeData.length; i++) {
                    let row = routeData[i];
                    if (row.some((col, colIndex) => colIndex >= 3 && col === keyword)) {
                        targetRow = row;
                        break;
                    }
                }
            }

            if (!targetRow) {
                document.getElementById("routeDisplay").innerText = "派生ルート：見つかりませんでした";
                document.getElementById("tableBody").innerHTML = `<tr><td colspan="24" style="padding: 20px; color: #ff6b6b;">「${keyword}」に一致する派生ルートが見つかりませんでした。</td></tr>`;
                document.getElementById("totalCredit").innerText = "0";
                document.getElementById("totalFame").innerText = "0";
                return;
            }

            // 新仕様：最初の3列（0:派生表通番, 1:NO, 2:目的派生検索）を無視し、3列目以降（index 3以降）のルートを抽出
            let routeNames = [];
            for (let i = 3; i < targetRow.length; i++) {
                let val = targetRow[i];
                if (val && val !== "0" && val !== "-" && val !== "") {
                    // 機体一覧CSVに存在する機体名か確認して追加
                    let existsInMech = mechDataList.some(mechRow => mechRow.includes(val));
                    if (existsInMech) {
                        if (!routeNames.includes(val)) {
                            routeNames.push(val);
                        }
                    }
                }
            }

            if (routeNames.length === 0) {
                document.getElementById("routeDisplay").innerText = "派生ルート：有効なルートが見つかりませんでした";
                document.getElementById("tableBody").innerHTML = `<tr><td colspan="24" style="padding: 20px; color: #ff6b6b;">「${keyword}」の派生ルートデータが見つかりませんでした。</td></tr>`;
                document.getElementById("totalCredit").innerText = "0";
                document.getElementById("totalFame").innerText = "0";
                return;
            }

            document.getElementById("routeDisplay").innerText = "派生ルート：" + routeNames.join(" ⇒ ");

            let tableHtml = "";
            let totalCredit = 0;
            let totalFame = 0;

            routeNames.forEach((mechName, index) => {
                let mechInfo = mechDataList.find(row => {
                    return row.some(col => col === mechName);
                });

                if (mechInfo) {
                    let transform = mechInfo[2] !== undefined ? mechInfo[2] : "-";
                    let hp = mechInfo[3] !== undefined ? mechInfo[3] : "-";
                    let armor = mechInfo[4] !== undefined ? mechInfo[4] : "-";
                    let mobility = mechInfo[5] !== undefined ? mechInfo[5] : "-";
                    let search = mechInfo[6] !== undefined ? mechInfo[6] : "-";
                    let en = mechInfo[7] !== undefined ? mechInfo[7] : "-";
                    let weight = mechInfo[8] !== undefined ? mechInfo[8] : "-";
                    let intuition = mechInfo[9] !== undefined ? mechInfo[9] : "-";
                    let control = mechInfo[10] !== undefined ? mechInfo[10] : "-";
                    let closeAtk = mechInfo[11] !== undefined ? mechInfo[11] : "-";
                    let midAtk = mechInfo[12] !== undefined ? mechInfo[12] : "-";
                    let longAtk = mechInfo[13] !== undefined ? mechInfo[13] : "-";
                    let fame = mechInfo[14] !== undefined ? mechInfo[14] : "0";
                    let nt = mechInfo[15] !== undefined ? mechInfo[15] : "-";
                    let size = mechInfo[16] !== undefined ? mechInfo[16] : "-";
                    let cost = mechInfo[17] !== undefined ? mechInfo[17] : "0";
                    let credit = mechInfo[18] !== undefined ? mechInfo[18] : "0";
                    let land = mechInfo[19] !== undefined ? mechInfo[19] : "-";
                    let water = mechInfo[20] !== undefined ? mechInfo[20] : "-";
                    let space = mechInfo[21] !== undefined ? mechInfo[21] : "-";
                    let air = mechInfo[22] !== undefined ? mechInfo[22] : "-";
                    let type = mechInfo[23] !== undefined ? mechInfo[23] : "-";

                    let creditNum = parseInt(String(credit).replace(/,/g, '')) || 0;
                    let fameNum = parseInt(String(fame).replace(/,/g, '')) || 0;
                    totalCredit += creditNum;
                    totalFame += fameNum;

                    tableHtml += `
                        <tr>
                            <td>${index + 1}</td>
                            <td class="name-col">${mechName}</td>
                            <td>${transform}</td>
                            <td>${hp}</td>
                            <td>${armor}</td>
                            <td>${mobility}</td>
                            <td>${search}</td>
                            <td>${en}</td>
                            <td>${weight}</td>
                            <td>${intuition}</td>
                            <td>${control}</td>
                            <td>${closeAtk}</td>
                            <td>${midAtk}</td>
                            <td>${longAtk}</td>
                            <td>${fame}</td>
                            <td>${nt}</td>
                            <td>${size}</td>
                            <td>${cost}</td>
                            <td>${credit}</td>
                            <td>${land}</td>
                            <td>${water}</td>
                            <td>${space}</td>
                            <td>${air}</td>
                            <td class="name-col">${type}</td>
                        </tr>
                    `;
                } else {
                    tableHtml += `
                        <tr>
                            <td>${index + 1}</td>
                            <td class="name-col">${mechName}</td>
                            <td colspan="22" style="color: #ff6b6b;">「機体一覧」CSVに詳細データが見つかりません</td>
                        </tr>
                    `;
                }
            });

            document.getElementById("tableBody").innerHTML = tableHtml;
            document.getElementById("totalCredit").innerText = totalCredit.toLocaleString();
            document.getElementById("totalFame").innerText = totalFame.toLocaleString();
        }
    </script>
</body>
</html>
