<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MSタクティクスSR - 機体派生ルート・総コストシミュレーター</title>
<style type="text/css">
  body {
    background: #141a24 url("https://mstactics.xsrv.jp/mst2/img/bg.gif");
    color: #d9d9d9;
    font-family: sans-serif;
    margin: 0;
    padding: 15px;
  }
  a { color: #99ccff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; }
  th, td { border: 1px solid #3a4c6a; padding: 6px 8px; font-size: 12px; }
  .b2 { background-color: #242c3d; }
  select, button {
    background-color: #1a2230;
    color: #d9d9d9;
    border: 1px solid #3a4c6a;
    padding: 5px 10px;
    font-size: 14px;
    cursor: pointer;
  }
  select:hover, button:hover { background-color: #3a4c6a; }
  .total-box {
    background-color: #1a2230;
    border: 1px solid #4a628a;
    padding: 15px;
    margin-top: 15px;
    border-radius: 4px;
  }
  .total-title { color: #99ccff; font-weight: bold; font-size: 15px; margin-bottom: 8px; }
  .total-value { font-size: 18px; color: #ffcc66; font-weight: bold; }
  hr { border: none; border-top: 1px solid #3a4c6a; margin: 15px 0; }
  .arrow-row { text-align: center; color: #99ccff; font-weight: bold; background-color: #1a1f2b; }
  .loading { text-align: center; padding: 20px; color: #99ccff; font-size: 14px; }
  .table-container { overflow-x: auto; }
</style>

<!-- CSVを高速で読み込むためのライブラリ（PapaParse） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
  // GoogleスプレッドシートのCSVエクスポート用URL
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1-Mqv3evqw4tHu9QPYpG8KBDijcAIBgWYLhNKzjArED4/export?format=csv";

  // 機体データを格納する箱（キー名: 機体名、またはNo）
  let unitsDatabaseByName = {};
  let unitsDatabaseByNo = {};

  // 全ての抽出された派生ルートを格納する配列
  let allRoutes = [];

  // ==========================================
  // 【元の派生ツリーテキストデータ】
  // 罫線（├や└、│）で表されたツリー構造をここにそのまま貼り付けておきます。
  // （※ここをご自身の元データのテキストに書き換えていくと、自動でルートが生成されます）
  // ==========================================
  const rawTreeText = `
ボール
├ボール改
│├機雷散布ポッド装備仕様ボール
│└ボール（第08MS小隊版）
└先行量産型ボール
`;

  // ページ読み込み時にスプレッドシートのデータを読み込む
  window.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('route-table-body');
      tbody.innerHTML = '<tr><td colspan="23" class="loading">Googleスプレッドシートからデータを読み込んでいます...</td></tr>';

      Papa.parse(SHEET_CSV_URL, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
              // 読み込んだデータを名前とNoの両方で引けるように整理
              results.data.forEach(row => {
                  let no = row["No"] ? row["No"].trim() : "";
                  let name = row["機体名"] ? row["機体名"].trim() : "";
                  if (name) {
                      unitsDatabaseByName[name] = row;
                  }
                  if (no) {
                      unitsDatabaseByNo[no] = row;
                  }
              });

              // 罫線ツリーテキストから派生ルートを自動解析する
              parseTreeTextToRoutes(rawTreeText);

              // プルダウンの選択肢を作成
              const selectBox = document.getElementById('routeSelect');
              allRoutes.forEach((route, index) => {
                  let option = document.createElement('option');
                  option.value = index;
                  option.textContent = route.name;
                  selectBox.appendChild(option);
              });

              // 初期ルートで計算を実行
              if (allRoutes.length > 0) {
                  changeRoute();
              } else {
                  tbody.innerHTML = '<tr><td colspan="23" style="color:#ff9999;" align="center">有効な派生ルートが見つかりませんでした。</td></tr>';
              }
          },
          error: function(err) {
              console.error("CSV読み込みエラー:", err);
              tbody.innerHTML = '<tr><td colspan="23" style="color:#ff9999;" align="center">データの読み込みに失敗しました。スプレッドシートの公開設定を確認してください。</td></tr>';
          }
      });
  });

  // 罫線ツリーテキストを解析して、各末端までのルートリストを自動生成する関数
  function parseTreeTextToRoutes(text) {
      const lines = text.split('\n');
      let stack = [];
      allRoutes = [];

      lines.forEach(line => {
          if (!line.trim()) return;

          // インデントの深さを計算（空白や罫線の文字数・構造から階層を推測）
          // 簡易的に、行頭のスペース、'│', '├', '└' の位置や個数から階層を割り出す
          let cleanLine = line.replace(/[│├└─]/g, '');
          let depth = 0;
          for (let i = 0; i < line.length; i++) {
              let char = line[i];
              if (char === ' ' || char === ' ' || char === '│' || char === '├' || char === '└' || char === '─') {
                  if (char === ' ' || char === ' ') depth++;
                  else depth += 2; // 罫線1文字分
              } else {
                  break;
              }
          }
          // 階層の深さを安全に丸める（2文字分を1階層程度に換算）
          let level = Math.floor(depth / 2);
          let unitName = cleanLine.trim();

          if (!unitName) return;

          // スタックの深さを調整
          stack = stack.slice(0, level);
          stack.push(unitName);

          // もし対応するスプレッドシートのデータ（または次の分岐）があればルートとして登録候補にする
          // ここでは「スタックに2つ以上（親から子へ繋がっている）溜まったら、1つのルートとしてみなす」
          if (stack.length >= 2) {
              let routeUnits = [...stack];
              // 機体名から対応するNo（または名前）の配列を作る
              let routeNos = routeUnits.map(name => {
                  return unitsDatabaseByName[name] ? unitsDatabaseByName[name]["No"] : name;
              });

              allRoutes.push({
                  name: `【ルート】 ${routeUnits[0]} ➔ ... ➔ ${routeUnits[routeUnits.length - 1]}`,
                  units: routeNos,
                  names: routeUnits
              });
          }
      });
  }

  // ルートが変更されたときの処理
  function changeRoute() {
      const selectedIndex = document.getElementById('routeSelect').value;
      const currentRoute = allRoutes[selectedIndex];
      
      const tbody = document.getElementById('route-table-body');
      let html = '';
      
      let sumCredit = 0;
      let sumMesei = 0;
      
      if (!currentRoute) return;

      currentRoute.names.forEach((unitName, index) => {
          // まず機体名で検索、見つからなければNoで検索
          let u = unitsDatabaseByName[unitName] || unitsDatabaseByNo[currentRoute.units[index]];
          
          if (u) {
              let credit = Number(String(u["クレジット"] || "0").replace(/,/g, ''));
              let mesei = Number(String(u["名声"] || "0").replace(/,/g, ''));
              
              sumCredit += credit;
              sumMesei += mesei;
              
              html += `<tr>
                  <td align="center">${u["No"] || ''}</td>
                  <td><b>${u["機体名"] || unitName}</b></td>
                  <td align="right">${u["ＨＰ"] || 0}</td>
                  <td align="right">${u["装甲"] || 0}</td>
                  <td align="right">${u["運動"] || 0}</td>
                  <td align="right">${u["索敵"] || 0}</td>
                  <td align="right">${u["ＥＮ"] || 0}</td>
                  <td align="right">${u["重量"] || 0}</td>
                  <td align="right">${u["直感"] || 0}</td>
                  <td align="right">${u["操縦"] || 0}</td>
                  <td align="right">${u["近"] || 0}</td>
                  <td align="right">${u["中"] || 0}</td>
                  <td align="right">${u["遠"] || 0}</td>
                  <td align="right">${mesei}</td>
                  <td align="center">${u["NT"] || '－'}</td>
                  <td align="center">${u["SIZE"] || '－'}</td>
                  <td align="right">${u["コスト"] || 0}</td>
                  <td align="right"><font color="#99CCFF">${credit.toLocaleString()}</font></td>
                  <td align="right">${u["地上"] || 0}</td>
                  <td align="right">${u["水中"] || 0}</td>
                  <td align="right">${u["宇宙"] || 0}</td>
                  <td align="right">${u["空中"] || 0}</td>
                  <td>${u["種別"] || ''}</td>
              </tr>`;
          } else {
              html += `<tr><td colspan="23" style="color:#ff9999;" align="center">機体名「${unitName}」のデータがスプレッドシートに見つかりません</td></tr>`;
          }

          // 最後の機体以外には「▼ 派生 ▼」の矢印行を挟む
          if (index < currentRoute.names.length - 1) {
              html += `<tr class="arrow-row"><td colspan="23">▼ 派生 ▼</td></tr>`;
          }
      });
      
      tbody.innerHTML = html;
      document.getElementById('total-credit').textContent = sumCredit.toLocaleString();
      document.getElementById('total-mesei').textContent = sumMesei.toLocaleString();
  }
</script>
</head>
<body>

<table border="0" style="width:auto;">
  <tr>
    <td><font size="+2"><B>機体派生ルート・総コストシミュレーター</b></font>&nbsp;</td>
  </tr>
</table>

<p>派生ツリーからルートを選択すると、Googleスプレッドシートから全ステータスを読み込み、総コストを自動計算します。</p>

<!-- 派生ルート選択フォーム -->
<div class="b2" style="padding: 12px; border: 1px solid #3a4c6a;">
  <label for="routeSelect"><b>派生ルート選択：</b></label>
  <select id="routeSelect" onchange="changeRoute()">
    <!-- 選択肢 -->
  </select>
</div>

<hr size="1">

<h3>ルート構成・機体詳細と個別コスト</h3>
<div class="table-container">
  <table>
    <tr class="b2">
      <th>No</th>
      <th>機体名</th>
      <th>ＨＰ</th>
      <th>装甲</th>
      <th>運動</th>
      <th>索敵</th>
      <th>ＥＮ</th>
      <th>重量</th>
      <th>直感</th>
      <th>操縦</th>
      <th>近</th>
      <th>中</th>
      <th>遠</th>
      <th>名声</th>
      <th>NT</th>
      <th>SIZE</th>
      <th>コスト</th>
      <th>クレジット</th>
      <th>地上</th>
      <th>水中</th>
      <th>宇宙</th>
      <th>空中</th>
      <th>種別</th>
    </tr>
    <tbody id="route-table-body">
      <!-- 読み込み中 -->
    </tbody>
  </table>
</div>

<!-- 総コスト出力ボックス -->
<div class="total-box">
  <div class="total-title">▼ 派生ルート総合計コスト</div>
  <div>累計必要クレジット： <span id="total-credit" class="total-value">0</span> クレジット</div>
  <div style="margin-top: 5px;">累計必要名声： <span id="total-mesei" class="total-value">0</span> 名声</div>
</div>

</body>
</html>
