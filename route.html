<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MSタクティクスSR - 機体派生ルート検索・総コストシミュレーター</title>
<style type="text/css">
  body {
    background: #141a24 url("https://mstactics.xsrv.jp/mst2/img/bg.gif");
    color: #d9d9d9;
    font-family: sans-serif;
    margin: 0;
    padding: 15px;
  }
  a { color: #99ccff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; }
  th, td { border: 1px solid #3a4c6a; padding: 6px 8px; font-size: 12px; }
  .b2 { background-color: #242c3d; }
  input[type="text"], button {
    background-color: #1a2230;
    color: #d9d9d9;
    border: 1px solid #3a4c6a;
    padding: 6px 12px;
    font-size: 14px;
  }
  input[type="text"] { width: 300px; }
  button { cursor: pointer; }
  button:hover { background-color: #3a4c6a; }
  .total-box {
    background-color: #1a2230;
    border: 1px solid #4a628a;
    padding: 15px;
    margin-top: 15px;
    border-radius: 4px;
  }
  .total-title { color: #99ccff; font-weight: bold; font-size: 15px; margin-bottom: 8px; }
  .total-value { font-size: 18px; color: #ffcc66; font-weight: bold; }
  hr { border: none; border-top: 1px solid #3a4c6a; margin: 15px 0; }
  .arrow-row { text-align: center; color: #99ccff; font-weight: bold; background-color: #1a1f2b; }
  .loading { text-align: center; padding: 20px; color: #99ccff; font-size: 14px; }
  .table-container { overflow-x: auto; }
  .route-path-display {
    background: #1a2230;
    border: 1px solid #3a4c6a;
    padding: 10px 15px;
    margin-top: 10px;
    font-weight: bold;
    color: #99ccff;
    border-radius: 4px;
  }
  .error-msg { text-align: center; padding: 20px; color: #ff9999; font-size: 14px; }
  .debug-box { background: #1f1a1a; border: 1px dashed #ff9999; padding: 10px; margin-top: 10px; font-size: 11px; color: #ffcccc; display: none; }
</style>

<!-- PapaParse（CSV高速読み込みライブラリ） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
  // 派生ルート用スプレッドシートのCSV出力URL
  const ROUTE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1lgpuRctrziQcRPtPGjEHTSyWf0sH1KW9tq-nJBnh-zU/export?format=csv";
  
  // ステータス用スプレッドシートのURL
  const STATUS_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1-Mqv3evqw4tHu9QPYpG8KBDijcAIBgWYLhNKzjArED4/export?format=csv";

  let unitsDatabase = {}; 
  let routeDatabase = {};  

  window.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('route-table-body');
      tbody.innerHTML = '<tr><td colspan="23" class="loading">スプレッドシートからデータを読み込んでいます...</td></tr>';

      // 1. ステータスデータの読み込み
      Papa.parse(STATUS_SHEET_CSV_URL, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: function(statusResults) {
              statusResults.data.forEach(row => {
                  let name = row["機体名"] ? row["機体名"].trim() : "";
                  if (name) {
                      unitsDatabase[name] = row;
                  }
              });

              // 2. 派生ルートデータの読み込み
              Papa.parse(ROUTE_SHEET_CSV_URL, {
                  download: true,
                  header: false, 
                  skipEmptyLines: true,
                  complete: function(routeResults) {
                      let rows = routeResults.data;
                      let loadedCount = 0;
                      let sampleKeys = [];
                      
                      // 2行目以降を走査（1行目はヘッダーと仮定）
                      for (let i = 1; i < rows.length; i++) {
                          let cols = rows[i];
                          // E列はインデックス4番目
                          let targetUnit = cols[4] ? cols[4].trim() : "";

                          if (targetUnit) {
                              let pathParts = [];
                              // G列（インデックス6番目）から右側のセルを順に確認
                              for (let c = 6; c < cols.length; c++) {
                                  let val = cols[c] ? cols[c].trim() : "";
                                  if (val !== "") {
                                      pathParts.push(val);
                                  }
                              }
                              // 最後に検索対象の機体自身を追加
                              pathParts.push(targetUnit);
                              routeDatabase[targetUnit] = pathParts;
                              loadedCount++;
                              if(sampleKeys.length < 5) sampleKeys.push(targetUnit);
                          }
                      }

                      if (loadedCount === 0) {
                          showDebug("警告: 派生ルートのデータが0件です。スプレッドシートのE列に機体名が正しく入力されているか、ウェブに公開されているかご確認ください。");
                      } else {
                          showDebug(`正常読み込み完了: 派生ルート登録数 ${loadedCount}件 (例: ${sampleKeys.join(', ')})`);
                      }

                      tbody.innerHTML = '<tr><td colspan="23" style="text-align:center; padding:20px; color:#99ccff;">準備完了しました。上の検索窓に機体名（例: コロンブス など）を入力して検索してください。</td></tr>';
                  },
                  error: function(err) {
                      console.error("ルートCSV読み込みエラー:", err);
                      showDebug("エラー: 派生ルート用スプレッドシートの読み込みに失敗しました。リンクや共有設定をご確認ください。");
                      tbody.innerHTML = '<tr><td colspan="23" class="error-msg">派生ルート用スプレッドシートの読み込みに失敗しました。下のデバッグ情報をご確認ください。</td></tr>';
                  }
              });
          },
          error: function(err) {
              console.error("ステータスCSV読み込みエラー:", err);
              tbody.innerHTML = '<tr><td colspan="23" class="error-msg">ステータス用スプレッドシートの読み込みに失敗しました。</td></tr>';
          }
      });
  });

  function showDebug(msg) {
      const dbg = document.getElementById('debugInfo');
      dbg.style.display = 'block';
      dbg.innerHTML += '<div>' + msg + '</div>';
  }

  // 検索ボタンが押されたときの処理
  function searchRoute() {
      let query = document.getElementById('searchInput').value.trim();
      const tbody = document.getElementById('route-table-body');
      const pathDisplay = document.getElementById('routePathText');
      
      if (!query) {
          alert('機体名を入力してください。');
          return;
      }

      // 派生ルートデータを取得
      let path = routeDatabase[query];

      if (!path || path.length === 0) {
          tbody.innerHTML = `<tr><td colspan="23" class="error-msg">機体名「${query}」の派生ルートがルート表に見つかりませんでした。<br>（ヒント: スプレッドシートのE列に「${query}」という機体名が正確に入力されているかご確認ください）</td></tr>`;
          pathDisplay.textContent = "ルートなし";
          document.getElementById('total-credit').textContent = "0";
          document.getElementById('total-mesei').textContent = "0";
          return;
      }

      // 派生ルートの文字列を表示
      pathDisplay.textContent = path.join(" ➔ ");

      let html = '';
      let sumCredit = 0;
      let sumMesei = 0;

      path.forEach((unitName, index) => {
          let u = unitsDatabase[unitName];

          if (u) {
              let credit = Number(String(u["クレジット"] || "0").replace(/,/g, ''));
              let mesei = Number(String(u["名声"] || "0").replace(/,/g, ''));
              
              sumCredit += credit;
              sumMesei += mesei;

              html += `<tr>
                  <td align="center">${u["No"] || ''}</td>
                  <td><b>${u["機体名"] || unitName}</b></td>
                  <td align="right">${u["ＨＰ"] || 0}</td>
                  <td align="right">${u["装甲"] || 0}</td>
                  <td align="right">${u["運動"] || 0}</td>
                  <td align="right">${u["索敵"] || 0}</td>
                  <td align="right">${u["ＥＮ"] || 0}</td>
                  <td align="right">${u["重量"] || 0}</td>
                  <td align="right">${u["直感"] || 0}</td>
                  <td align="right">${u["操縦"] || 0}</td>
                  <td align="right">${u["近"] || 0}</td>
                  <td align="right">${u["中"] || 0}</td>
                  <td align="right">${u["遠"] || 0}</td>
                  <td align="right">${mesei}</td>
                  <td align="center">${u["NT"] || '－'}</td>
                  <td align="center">${u["SIZE"] || '－'}</td>
                  <td align="right">${u["コスト"] || 0}</td>
                  <td align="right"><font color="#99CCFF">${credit.toLocaleString()}</font></td>
                  <td align="right">${u["地上"] || 0}</td>
                  <td align="right">${u["水中"] || 0}</td>
                  <td align="right">${u["宇宙"] || 0}</td>
                  <td align="right">${u["空中"] || 0}</td>
                  <td>${u["種別"] || ''}</td>
              </tr>`;
          } else {
              html += `<tr>
                  <td align="center">-</td>
                  <td><b>${unitName}</b></td>
                  <td colspan="21" style="color:#ff9999;" align="center">ステータス表に「${unitName}」のデータが見つかりません</td>
              </tr>`;
          }

          if (index < path.length - 1) {
              html += `<tr class="arrow-row"><td colspan="23">▼ 派生 ▼</td></tr>`;
          }
      });

      tbody.innerHTML = html;
      document.getElementById('total-credit').textContent = sumCredit.toLocaleString();
      document.getElementById('total-mesei').textContent = sumMesei.toLocaleString();
  }
</script>
</head>
<body>

<table border="0" style="width:auto;">
  <tr>
    <td><font size="+2"><B>機体派生ルート検索・総コストシミュレーター</b></font>&nbsp;</td>
  </tr>
</table>

<p>作りたい最終機体の名前（E列の機体）を検索すると、スプレッドシートのG列以降に記録された派生ルートを順番に並べ、総コストを自動計算します。</p>

<!-- 検索フォーム -->
<div class="b2" style="padding: 12px; border: 1px solid #3a4c6a;">
  <label for="searchInput"><b>最終機体名で検索：</b></label>
  <input type="text" id="searchInput" placeholder="例: コロンブス など" onkeydown="if(event.key==='Enter')searchRoute();">
  <button onclick="searchRoute()">検索・計算</button>
</div>

<!-- デバッグ表示エリア -->
<div id="debugInfo" class="debug-box"><b>【動作確認ログ】</b><br></div>

<!-- 派生ルートの可視化表示 -->
<div class="route-path-display">
  派生ルート： <span id="routePathText" style="color:#ffffff;">未検索</span>
</div>

<hr size="1">

<h3>ルート構成・機体詳細と個別コスト</h3>
<div class="table-container">
  <table>
    <tr class="b2">
      <th>No</th>
      <th>機体名</th>
      <th>ＨＰ</th>
      <th>装甲</th>
      <th>運動</th>
      <th>索敵</th>
      <th>ＥＮ</th>
      <th>重量</th>
      <th>直感</th>
      <th>操縦</th>
      <th>近</th>
      <th>中</th>
      <th>遠</th>
      <th>名声</th>
      <th>NT</th>
      <th>SIZE</th>
      <th>コスト</th>
      <th>クレジット</th>
      <th>地上</th>
      <th>水中</th>
      <th>宇宙</th>
      <th>空中</th>
      <th>種別</th>
    </tr>
    <tbody id="route-table-body">
      <!-- 初期メッセージ -->
    </tbody>
  </table>
</div>

<!-- 総コスト出力ボックス -->
<div class="total-box">
  <div class="total-title">▼ 派生ルート総合計コスト</div>
  <div>累計必要クレジット： <span id="total-credit" class="total-value">0</span> クレジット</div>
  <div style="margin-top: 5px;">累計必要名声： <span id="total-mesei" class="total-value">0</span> 名声</div>
</div>

</body>
</html>
