<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MSタクティクスSR - 機体派生ルート検索・総コストシミュレーター</title>
<style type="text/css">
  body {
    background: #141a24 url("https://mstactics.xsrv.jp/mst2/img/bg.gif");
    color: #d9d9d9;
    font-family: sans-serif;
    margin: 0;
    padding: 15px;
  }
  a { color: #99ccff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; }
  th, td { border: 1px solid #3a4c6a; padding: 6px 8px; font-size: 12px; }
  .b2 { background-color: #242c3d; }
  input[type="text"], button {
    background-color: #1a2230;
    color: #d9d9d9;
    border: 1px solid #3a4c6a;
    padding: 6px 12px;
    font-size: 14px;
  }
  input[type="text"] { width: 300px; }
  button { cursor: pointer; }
  button:hover { background-color: #3a4c6a; }
  .total-box {
    background-color: #1a2230;
    border: 1px solid #4a628a;
    padding: 15px;
    margin-top: 15px;
    border-radius: 4px;
  }
  .total-title { color: #99ccff; font-weight: bold; font-size: 15px; margin-bottom: 8px; }
  .total-value { font-size: 18px; color: #ffcc66; font-weight: bold; }
  hr { border: none; border-top: 1px solid #3a4c6a; margin: 15px 0; }
  .arrow-row { text-align: center; color: #99ccff; font-weight: bold; background-color: #1a1f2b; }
  .loading { text-align: center; padding: 20px; color: #99ccff; font-size: 14px; }
  .table-container { overflow-x: auto; }
  .route-path-display {
    background: #1a2230;
    border: 1px solid #3a4c6a;
    padding: 10px 15px;
    margin-top: 10px;
    font-weight: bold;
    color: #99ccff;
    border-radius: 4px;
  }
  .error-msg { text-align: center; padding: 20px; color: #ff9999; font-size: 14px; }
</style>

<!-- CSVを高速で読み込むためのライブラリ（PapaParse） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
  // GoogleスプレッドシートのCSVエクスポート用URL
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1-Mqv3evqw4tHu9QPYpG8KBDijcAIBgWYLhNKzjArED4/export?format=csv";

  // データを格納する箱
  let unitsDatabaseByName = {};
  let unitsDatabaseByNo = {};
  
  // 機体名から「親の機体名」を引くための辞書（例: childToParent["コロンブス"] = "スーツキャリアー"）
  let childToParent = {};

  // ==========================================
  // 【派生ツリーテキストデータ】
  // 画像のような罫線ツリーをここに貼り付けておきます。
  // （※ここをどんどん増やしていけば、全機体のルートが網羅されます！）
  // ==========================================
  const rawTreeText = `
ボール
├ボールK型
│├ボール改
││├機雷散布ポッド装備仕様ボール
││├トロハチ
││└ソロモン攻略戦仕様ボール
│├フィッシュアイ
│└連邦宇宙輸送艇
│ │ └スーツキャリアー
│ │   └コロンブス
│ │     ├フリーデン
│ │     │ ├アオヤギ
│ │     │ │ ├アマネセル
│ │     │ │ ├アストラーーザ
│ │     │ │ │ └ガーベラ
│ │     │ │ └バルトーク
│ │     │ ├フリーデンII
│ │     │ ├グリーツ艦
│ │     │ ├トリエステ
│ │     │ ├シーバルチャー艦
│ │     │ │ └ドリテア護衛艦
│ │     │ │   ├ドリテア
│ │     │ │   └ポリペイモス
│ │     │ ├超大型輸送機
│ │     │ └フォート・セバーン
│ │     ├ヨーツンヘイム
│ │     └コロンブス改
│ ├サンダーボルト仕様ボール
│ ├ボール・ボーイ
│ ├ロウ専用キメラ
│ ├リーアム専用キメラ
│ └樹里専用キメラ
`;

  // ページ読み込み時にスプレッドシートデータとツリー解析を行う
  window.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('route-table-body');
      tbody.innerHTML = '<tr><td colspan="23" class="loading">Googleスプレッドシートからデータを読み込んでいます...</td></tr>';

      Papa.parse(SHEET_CSV_URL, {
          download: true,
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
              results.data.forEach(row => {
                  let no = row["No"] ? row["No"].trim() : "";
                  let name = row["機体名"] ? row["機体名"].trim() : "";
                  if (name) unitsDatabaseByName[name] = row;
                  if (no) unitsDatabaseByNo[no] = row;
              });

              // ツリー構造を解析して親子関係マップを作る
              parseTreeTextToMap(rawTreeText);

              tbody.innerHTML = '<tr><td colspan="23" style="text-align:center; padding:20px; color:#99ccff;">上の検索窓に機体名（例: コロンブス、ボール改 など）を入力して検索ボタンを押してください。</td></tr>';
          },
          error: function(err) {
              console.error("CSV読み込みエラー:", err);
              tbody.innerHTML = '<tr><td colspan="23" class="error-msg">データの読み込みに失敗しました。スプレッドシートの公開設定を確認してください。</td></tr>';
          }
      });
  });

  // ツリーテキストから「子→親」の繋がりを自動解析する関数
  function parseTreeTextToMap(text) {
      const lines = text.split('\n');
      let stack = [];

      lines.forEach(line => {
          if (!line.trim()) return;

          // 「改」などのマークや余分な説明テキスト（例: ◆設計...）を除去して綺麗にする汚染防止
          let cleanLine = line.replace(/[│├└─]/g, '').trim();
          // 設計情報や余分なメモがあれば機体名だけ抜き出す
          if (cleanLine.includes('◆')) {
              cleanLine = cleanLine.split('◆')[0].trim();
          }

          // インデントの深さを計算
          let depth = 0;
          for (let i = 0; i < line.length; i++) {
              let char = line[i];
              if (char === ' ' || char === ' ' || char === '│' || char === '├' || char === '└' || char === '─') {
                  if (char === ' ' || char === ' ') depth++;
                  else depth += 2;
              } else {
                  break;
              }
          }
          let level = Math.floor(depth / 2);
          let unitName = cleanLine;

          if (!unitName) return;

          stack = stack.slice(0, level);
          
          if (stack.length > 0) {
              let parentName = stack[stack.length - 1];
              childToParent[unitName] = parentName;
          }
          
          stack.push(unitName);
      });
  }

  // 検索ボタンが押されたときの処理
  function searchRoute() {
      let query = document.getElementById('searchInput').value.trim();
      const tbody = document.getElementById('route-table-body');
      const pathDisplay = document.getElementById('routePathText');
      
      if (!query) {
          alert('機体名を入力してください。');
          return;
      }

      // 入力された機体から遡ってルート（配列）を組み立てる
      let current = query;
      let path = [current];
      let safetyCount = 0;

      // 親を辿ってトップまで遡る
      while (childToParent[current] && safetyCount < 50) {
          current = childToParent[current];
          path.unshift(current); // 先頭に追加していく
          safetyCount++;
      }

      // もしツリー内に見つからなかった場合（単体機体などの場合）
      if (path.length === 1 && !unitsDatabaseByName[query]) {
          tbody.innerHTML = `<tr><td colspan="23" class="error-msg">機体名「${query}」が見つかりませんでした。（ツリー構造に登録されていないか、名前が一致していません）</td></tr>`;
          pathDisplay.textContent = "ルートなし";
          document.getElementById('total-credit').textContent = "0";
          document.getElementById('total-mesei').textContent = "0";
          return;
      }

      // 派生ルートの文字列を表示
      pathDisplay.textContent = path.join(" ➔ ");

      let html = '';
      let sumCredit = 0;
      let sumMesei = 0;

      path.forEach((unitName, index) => {
          let u = unitsDatabaseByName[unitName];

          if (u) {
              let credit = Number(String(u["クレジット"] || "0").replace(/,/g, ''));
              let mesei = Number(String(u["名声"] || "0").replace(/,/g, ''));
              
              sumCredit += credit;
              sumMesei += mesei;

              html += `<tr>
                  <td align="center">${u["No"] || ''}</td>
                  <td><b>${u["機体名"] || unitName}</b></td>
                  <td align="right">${u["ＨＰ"] || 0}</td>
                  <td align="right">${u["装甲"] || 0}</td>
                  <td align="right">${u["運動"] || 0}</td>
                  <td align="right">${u["索敵"] || 0}</td>
                  <td align="right">${u["ＥＮ"] || 0}</td>
                  <td align="right">${u["重量"] || 0}</td>
                  <td align="right">${u["直感"] || 0}</td>
                  <td align="right">${u["操縦"] || 0}</td>
                  <td align="right">${u["近"] || 0}</td>
                  <td align="right">${u["中"] || 0}</td>
                  <td align="right">${u["遠"] || 0}</td>
                  <td align="right">${mesei}</td>
                  <td align="center">${u["NT"] || '－'}</td>
                  <td align="center">${u["SIZE"] || '－'}</td>
                  <td align="right">${u["コスト"] || 0}</td>
                  <td align="right"><font color="#99CCFF">${credit.toLocaleString()}</font></td>
                  <td align="right">${u["地上"] || 0}</td>
                  <td align="right">${u["水中"] || 0}</td>
                  <td align="right">${u["宇宙"] || 0}</td>
                  <td align="right">${u["空中"] || 0}</td>
                  <td>${u["種別"] || ''}</td>
              </tr>`;
          } else {
              html += `<tr><td colspan="23" style="color:#ff9999;" align="center">機体名「${unitName}」のデータがスプレッドシートに見つかりません</td></tr>`;
          }

          // 最後の機体以外には「▼ 派生 ▼」の矢印行を挟む
          if (index < path.length - 1) {
              html += `<tr class="arrow-row"><td colspan="23">▼ 派生 ▼</td></tr>`;
          }
      });

      tbody.innerHTML = html;
      document.getElementById('total-credit').textContent = sumCredit.toLocaleString();
      document.getElementById('total-mesei').textContent = sumMesei.toLocaleString();
  }
</script>
</head>
<body>

<table border="0" style="width:auto;">
  <tr>
    <td><font size="+2"><B>機体派生ルート検索・総コストシミュレーター</b></font>&nbsp;</td>
  </tr>
</table>

<p>作りたい最終機体の名前を入力して検索すると、そこまでの派生ルート、全ステータス、および総コストを自動計算します。</p>

<!-- 検索フォーム -->
<div class="b2" style="padding: 12px; border: 1px solid #3a4c6a;">
  <label for="searchInput"><b>最終機体名で検索：</b></label>
  <input type="text" id="searchInput" placeholder="例: コロンبス、ボール改 など" onkeydown="if(event.key==='Enter')searchRoute();">
  <button onclick="searchRoute()">検索・計算</button>
</div>

<!-- 派生ルートの可視化表示 -->
<div class="route-path-display">
  派生ルート： <span id="routePathText" style="color:#ffffff;">未検索</span>
</div>

<hr size="1">

<h3>ルート構成・機体詳細と個別コスト</h3>
<div class="table-container">
  <table>
    <tr class="b2">
      <th>No</th>
      <th>機体名</th>
      <th>ＨＰ</th>
      <th>装甲</th>
      <th>運動</th>
      <th>索敵</th>
      <th>ＥＮ</th>
      <th>重量</th>
      <th>直感</th>
      <th>操縦</th>
      <th>近</th>
      <th>中</th>
      <th>遠</th>
      <th>名声</th>
      <th>NT</th>
      <th>SIZE</th>
      <th>コスト</th>
      <th>クレジット</th>
      <th>地上</th>
      <th>水中</th>
      <th>宇宙</th>
      <th>空中</th>
      <th>種別</th>
    </tr>
    <tbody id="route-table-body">
      <!-- 初期メッセージ -->
    </tbody>
  </table>
</div>

<!-- 総コスト出力ボックス -->
<div class="total-box">
  <div class="total-title">▼ 派生ルート総合計コスト</div>
  <div>累計必要クレジット： <span id="total-credit" class="total-value">0</span> クレジット</div>
  <div style="margin-top: 5px;">累計必要名声： <span id="total-mesei" class="total-value">0</span> 名声</div>
</div>

</body>
</html>
