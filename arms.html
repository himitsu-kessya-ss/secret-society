<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Arms depot - 秘密結社の部屋</title>
    <!-- Armsページ専用のCSSを読み込み -->
    <link rel="stylesheet" href="arms.css">
</head>
<body>

    <!-- ▼ 共通ヘッダーが自動でここに読み込まれます -->
    <div id="header-container"></div>

    <div class="top-section">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('weapon')">⚔️ 武器一覧</button>
            <button class="tab-btn" onclick="switchTab('equip')">🛡️ 装備一覧</button>
            <button class="tab-btn" onclick="switchTab('system')">⚙️ 独自システム「武器庫」解説</button>
            <button class="tab-btn" onclick="switchTab('simulation')">🛠️ 武器庫シミュレーション</button>
        </div>
        
        <div class="search-area" id="search-wrapper">
            <select id="search-column"></select>
            <input type="text" id="search-box" placeholder="キーワードを入力..." onkeyup="filterData()">
        </div>
    </div>

    <div class="main-content">
        <!-- 武器一覧タブ -->
        <div id="weapon" class="tab-content">
            <table>
                <thead><tr id="weapon-head"></tr></thead>
                <tbody id="weapon-body"></tbody>
            </table>
        </div>

        <!-- 装備一覧タブ -->
        <div id="equip" class="tab-content" style="display:none;">
            <table>
                <thead><tr id="equip-head"></tr></thead>
                <tbody id="equip-body"></tbody>
            </table>
        </div>

        <!-- 独自システム解説タブ -->
        <div id="system" class="tab-content" style="display:none;">
            <div class="info-box" id="system-content">読み込み中...</div>
        </div>

        <!-- 🛠️ 武器庫シミュレーションタブ -->
        <div id="simulation" class="tab-content" style="display:none;">
            <div class="simulator-grid">
                
                <!-- 左側：設定パネル -->
                <div class="sim-panel">
                    <h2>▼ 武器カスタマイズ</h2>

                    <!-- プレイヤー熟練度 -->
                    <div class="sim-form-group" style="background: rgba(0, 212, 255, 0.03); padding: 6px 8px; border-radius: 4px; border: 1px solid var(--border-color);">
                        <label style="color: var(--accent-color); font-weight: bold; margin-bottom: 2px;">プレイヤー熟練度 (武器庫開放: 200)</label>
                        <div style="display: flex; align-items: center; justify-content: space-between;">
                            <div class="counter-control">
                                <button class="counter-btn" onclick="changeMastery(-10)">-10</button>
                                <button class="counter-btn" onclick="changeMastery(-1)">-</button>
                                <input type="number" id="playerMastery" value="200" min="200" max="1000" onchange="calculateSimulation()" style="width: 60px;">
                                <button class="counter-btn" onclick="changeMastery(1)">+</button>
                                <button class="counter-btn" onclick="changeMastery(10)">+10</button>
                            </div>
                            <button class="item-clear-btn" onclick="clearMastery()">クリア</button>
                        </div>
                    </div>

                    <!-- ベース武器選択 -->
                    <div class="sim-form-group">
                        <label>ベース武器の選択</label>
                        <select id="baseWeaponSelect" onchange="calculateSimulation()"></select>
                    </div>

                    <!-- 属性変更セレクトボックス -->
                    <div class="sim-form-group">
                        <label id="labelElementChange">属性変更カスタム</label>
                        <select id="elementSelect" onchange="calculateSimulation()">
                            <option value="変更なし">変更なし (属性変更しない)</option>
                            <option value="ビーム">ビーム</option>
                            <option value="実弾">実弾</option>
                            <option value="ヒート">ヒート</option>
                            <option value="海洋強化">海洋強化</option>
                        </select>
                    </div>

                    <!-- 改造コントロールの動的生成領域 -->
                    <div id="upgradeControls"></div>

                    <!-- 特殊カスタムオプション（名称変更・限定解除・上限解放） -->
                    <div class="sim-form-group" style="margin-top: 6px;">
                        <label>特殊カスタムオプション（固定コスト）</label>
                        
                        <div class="sim-checkbox-group">
                            <input type="checkbox" id="renameCheck" onchange="calculateSimulation()">
                            <label for="renameCheck" id="labelRename" style="margin:0; color:#fff; cursor:pointer; font-size:0.8rem;"></label>
                        </div>
                        <div class="sim-form-group" id="renameInputGroup" style="display:none; margin: 4px 0 6px 0;">
                            <input type="text" id="customNameInput" placeholder="新しい武器の名称を入力..." oninput="calculateSimulation()">
                        </div>

                        <div class="sim-checkbox-group">
                            <input type="checkbox" id="universalCheck" onchange="calculateSimulation()">
                            <label for="universalCheck" id="labelUniversal" style="margin:0; color:#fff; cursor:pointer; font-size:0.8rem;"></label>
                        </div>
                        <div class="sim-checkbox-group">
                            <input type="checkbox" id="limitBreakCheck" onchange="calculateSimulation()">
                            <label for="limitBreakCheck" id="labelLimitBreak" style="margin:0; color:#fff; cursor:pointer; font-size:0.8rem;"></label>
                        </div>
                    </div>

                    <!-- 全クリアボタン（ここに確実に配置！） -->
                    <button class="global-clear-btn" onclick="resetAllCustoms()">すべてのカスタムをクリア</button>
                </div>

                <!-- 右側：結果表示パネル -->
                <div class="sim-panel">
                    <h2>▼ シミュレーション結果</h2>

                    <!-- ステータス比較テーブル -->
                    <div class="sim-form-group">
                        <label>性能比較（改造前 ➔ シミュレーション後）</label>
                        <table>
                            <thead>
                                <tr>
                                    <th>項目</th>
                                    <th>改造前</th>
                                    <th>シミュレーション後</th>
                                </tr>
                            </thead>
                            <tbody id="comparisonTableBody"></tbody>
                        </table>
                    </div>

                    <!-- レシート風コスト明細 -->
                    <div class="receipt-box">
                        <div class="receipt-title">武器カスタムコスト・明細</div>
                        <div id="receiptItems"></div>
                        <!-- 合計カスタム回数表示 -->
                        <div class="receipt-total" style="border-top: 1px dashed var(--border-color); font-size: 0.85rem; color: #aaa;">
                            <span>合計カスタム回数:</span>
                            <span id="totalModCount" style="color: var(--accent-color);">0 回</span>
                        </div>
                        <div class="receipt-total">
                            <span>合計クレジット (cr):</span>
                            <span id="totalCredit" style="color: var(--accent-color);">0 cr</span>
                        </div>
                        <div class="receipt-total" style="font-size: 0.85rem; border-top: none; padding-top: 2px;">
                            <span>合計名声:</span>
                            <span id="totalFame" style="color: #ff9900;">0</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- 共通ヘッダー読み込みスクリプト -->
    <script>
        fetch('header.html')
            .then(response => {
                if (!response.ok) throw new Error('ヘッダー読み込み失敗');
                return response.text();
            })
            .then(data => {
                const container = document.getElementById('header-container');
                if (container) {
                    container.innerHTML = data;
                    const currentPath = window.location.pathname.split('/').pop();
                    const navLinks = document.querySelectorAll('.nav-links a');
                    navLinks.forEach(link => {
                        if (link.getAttribute('href') === currentPath) {
                            link.classList.add('active');
                        }
                    });
                }
            })
            .catch(err => console.log("ヘッダー読み込みスキップ: ", err));
    </script>

    <!-- 外部JavaScript（arms.js のみ読み込み） -->
    <script src="arms.js"></script>

    <!-- アクセス解析カウンター -->
    <script data-goatcounter="https://bobs-base.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
