<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レイドボス攻略データベース | -Secret Society-</title>
  <style>
    :root {
      --bg-main: #0f111a;
      --bg-card: #1a1d2e;
      --bg-card-hover: #242942;
      --bg-panel: #151824;
      --border-color: #2e344e;
      --accent-gold: #f5b041;
      --accent-blue: #3498db;
      --accent-red: #e74c3c;
      --accent-pink: #ff4d88;
      --text-main: #e6e9f0;
      --text-muted: #9aa3b8;
      --attr-beam: #2ecc71;
      --attr-solid: #95a5a6;
      --attr-heat: #e74c3c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: "Meiryo", "Hiragino Kaku Gothic ProN", sans-serif;
      line-height: 1.6;
      padding-bottom: 60px;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 20px 15px;
    }

    /* ヘッダー・タブ */
    .page-header {
      text-align: center;
      margin-bottom: 24px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 16px;
    }
    .page-header h1 {
      font-size: 1.8rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(245, 176, 65, 0.3);
    }
    .page-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      background: var(--bg-card-hover);
      color: #fff;
    }
    .tab-btn.active {
      background: var(--accent-gold);
      color: #111;
      border-color: var(--accent-gold);
    }

    /* ボス一覧グリッド */
    .boss-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }
    .boss-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }
    .boss-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-gold);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    }
    .boss-img-wrap {
      width: 100%;
      height: 150px;
      background: #0a0c12;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border-bottom: 1px solid var(--border-color);
      overflow: hidden;
    }
    .boss-img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .boss-no-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.75);
      color: var(--accent-gold);
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
    }
    .post-count-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(52, 152, 219, 0.88);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: bold;
    }
    .boss-card-body {
      padding: 14px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .boss-card-title {
      font-size: 1.05rem;
      font-weight: bold;
      color: #fff;
      margin-bottom: 4px;
    }
    .boss-card-pilot {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .boss-card-sub {
      font-size: 0.75rem;
      color: var(--accent-gold);
      margin-top: 6px;
    }

    /* ボス詳細（攻略画面） */
    .back-btn {
      background: transparent;
      color: var(--accent-blue);
      border: 1px solid var(--accent-blue);
      padding: 6px 14px;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 16px;
      font-size: 0.9rem;
    }
    .back-btn:hover {
      background: var(--accent-blue);
      color: #fff;
    }

    .boss-hero-banner {
      background: linear-gradient(135deg, #1d2238 0%, #111422 100%);
      border: 2px solid var(--accent-red);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      gap: 24px;
      align-items: center;
      margin-bottom: 24px;
      box-shadow: 0 0 20px rgba(231, 76, 60, 0.2);
      flex-wrap: wrap;
    }
    .boss-hero-img {
      width: 220px;
      height: 180px;
      background: #080a0f;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .boss-hero-img img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .boss-hero-info {
      flex-grow: 1;
      min-width: 260px;
    }
    .raid-alert {
      display: inline-block;
      background: var(--accent-red);
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 2px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .boss-hero-info h2 {
      font-size: 1.6rem;
      color: #fff;
      margin-bottom: 4px;
    }
    .boss-hero-pilot {
      font-size: 1rem;
      color: var(--accent-gold);
      margin-bottom: 14px;
      font-weight: bold;
    }

    .spec-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-panel);
      font-size: 0.9rem;
    }
    .spec-table th, .spec-table td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: left;
    }
    .spec-table th {
      background: #22273d;
      color: var(--text-muted);
      width: 110px;
    }

    /* 属性バッジ */
    .badge-attr {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.8rem;
      color: #111;
    }
    .attr-beam { background: var(--attr-beam); }
    .attr-solid { background: var(--attr-solid); }
    .attr-heat { background: var(--attr-heat); color: #fff; }

    /* フォーム＆パネル */
    .panel-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .panel-title {
      font-size: 1.15rem;
      color: var(--accent-gold);
      border-left: 4px solid var(--accent-gold);
      padding-left: 10px;
      margin-bottom: 16px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 14px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .form-group.full-width {
      grid-column: 1 / -1;
    }
    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: bold;
    }
    .req-mark {
      color: var(--accent-red);
      margin-left: 4px;
    }
    input[type="text"], input[type="password"], textarea, select {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 10px;
      border-radius: 5px;
      font-size: 0.9rem;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-gold);
    }
    .checkbox-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--bg-panel);
      padding: 10px 12px;
      border-radius: 5px;
      border: 1px solid var(--border-color);
    }
    .checkbox-group label {
      color: #fff;
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--accent-gold);
      color: #111;
      border: none;
      padding: 10px 24px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-primary:hover:not(:disabled) {
      opacity: 0.9;
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #2c334d;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 7px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-secondary:hover {
      background: #3b4466;
    }

    /* 攻略編成一覧 */
    .comp-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }
    .comp-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .comp-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .comp-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .comp-meta strong {
      color: #fff;
      font-size: 0.95rem;
    }
    .hp-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .hp-tag {
      background: rgba(245, 176, 65, 0.18);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      font-size: 0.78rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .comp-specs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
      background: var(--bg-card);
      padding: 10px;
      border-radius: 6px;
      font-size: 0.88rem;
      margin-bottom: 10px;
    }
    .comp-specs span {
      color: var(--text-muted);
      font-size: 0.78rem;
      display: block;
    }
    .comp-comment {
      font-size: 0.9rem;
      color: #dce1ec;
      white-space: pre-wrap;
      margin-bottom: 10px;
    }
    .comp-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .like-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 5px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .like-btn:hover {
      border-color: var(--accent-pink);
    }
    .like-btn.liked {
      border-color: var(--accent-pink);
      background: rgba(255, 77, 136, 0.15);
    }
    .heart-icon {
      font-size: 1.1rem;
      color: var(--text-muted);
    }
    .like-btn.liked .heart-icon {
      color: var(--accent-pink);
    }
    .del-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
    }
    .del-btn:hover {
      color: var(--accent-red);
    }

    /* ボス情報まとめテーブル（閲覧専用） */
    .table-wrap {
      overflow-x: auto;
    }
    .master-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      white-space: nowrap;
    }
    .master-table th, .master-table td {
      border: 1px solid var(--border-color);
      padding: 9px 12px;
      text-align: left;
    }
    .master-table th {
      background: #22273d;
      color: var(--accent-gold);
    }
    .master-table tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 既存の共通ヘッダーがあれば読み込み -->
  <div id="common-header"></div>

  <div class="container">
    <header class="page-header">
      <h1>RAID BOSS ARCHIVE</h1>
      <p>レイドボス攻略データベース ＆ 推奨編成共有システム</p>
    </header>

    <!-- ナビゲーションタブ -->
    <nav class="nav-tabs">
      <button class="tab-btn active" id="tab-list">🎯 レイドボス一覧</button>
      <button class="tab-btn" id="tab-master">📊 ボス情報まとめ</button>
    </nav>

    <!-- ① ボス一覧ビュー -->
    <section id="view-list">
      <div class="boss-grid" id="boss-grid"></div>
    </section>

    <!-- ② 個別ボス攻略ビュー -->
    <section id="view-detail" class="hidden">
      <button class="back-btn" id="back-to-list-btn">← ボス一覧に戻る</button>
      <div id="boss-detail-content"></div>

      <!-- 攻略編成投稿フォーム -->
      <div class="panel-box">
        <h3 class="panel-title">📝 攻略編成を投稿する</h3>
        <form id="comp-form">
          <div class="form-grid">
            <!-- 前半部 -->
            <div class="form-group full-width">
              <label>ボス残りHP割合（複数チェック可）<span class="req-mark">*</span></label>
              <div class="checkbox-group">
                <label><input type="checkbox" name="hpCond" value="残り５割以上"> 残り５割以上</label>
                <label><input type="checkbox" name="hpCond" value="残り５割未満"> 残り５割未満</label>
                <label><input type="checkbox" name="hpCond" value="残り３割以下"> 残り３割以下</label>
              </div>
            </div>

            <div class="form-group">
              <label>機体名<span class="req-mark">*</span></label>
              <input type="text" id="f-unitName" required placeholder="例：Zガンダム">
            </div>
            <div class="form-group">
              <label>機体カスタム（任意）</label>
              <input type="text" id="f-unitCustom" placeholder="例：機動カスタム">
            </div>
            <div class="form-group">
              <label>武器<span class="req-mark">*</span></label>
              <input type="text" id="f-weapon" required placeholder="例：ハイパー・メガ・ランチャー">
            </div>
            <div class="form-group">
              <label>装備<span class="req-mark">*</span></label>
              <input type="text" id="f-equipment" required placeholder="例：バイオセンサー">
            </div>
            <div class="form-group">
              <label>特性（任意）</label>
              <input type="text" id="f-trait" placeholder="例：NT覚醒">
            </div>

            <!-- 後半部 -->
            <div class="form-group">
              <label>投稿No.（自動採番）</label>
              <input type="text" id="f-postNo" readonly style="color: var(--accent-gold); font-weight: bold;">
            </div>
            <div class="form-group">
              <label>投稿者名<span class="req-mark">*</span></label>
              <input type="text" id="f-author" required placeholder="パイロット名">
            </div>
            <div class="form-group">
              <label>投稿PW（4桁数字・削除用）<span class="req-mark">*</span></label>
              <input type="password" id="f-password" required pattern="\d{4}" maxlength="4" placeholder="1234">
            </div>
            <div class="form-group full-width">
              <label>コメント（任意）</label>
              <textarea id="f-comment" rows="2" placeholder="立ち回りや注意点など"></textarea>
            </div>
          </div>
          <button type="submit" class="btn-primary" id="submit-comp-btn">編成を投稿する</button>
        </form>
      </div>

      <!-- 投稿された攻略編成一覧 -->
      <div class="panel-box">
        <div class="comp-header-bar">
          <h3 class="panel-title" style="margin-bottom:0;">⚔️ 投稿された攻略編成一覧</h3>
          <div>
            <select id="sort-select">
              <option value="likes">いいね数の多い順</option>
              <option value="newest">新しい順（投稿No.降順）</option>
              <option value="oldest">古い順（投稿No.昇順）</option>
            </select>
            <button type="button" class="btn-secondary" id="export-comp-btn" style="margin-left:8px;">💾 Boss_BestCompData.js 出力</button>
          </div>
        </div>
        <div id="comp-list">
          <p style="color:var(--text-muted); text-align:center; padding:20px;">データを読み込み中...</p>
        </div>
      </div>
    </section>

    <!-- ③ ボス情報まとめビュー（GitHub管理・閲覧専用） -->
    <section id="view-master" class="hidden">
      <div class="panel-box">
        <div class="comp-header-bar">
          <h3 class="panel-title" style="margin-bottom:0;">📊 ボス情報まとめ一覧</h3>
        </div>
        <p style="font-size:0.82rem; color:var(--text-muted); margin-bottom:12px;">
          ※ボス情報は <code>Boss/BossData.js</code> で管理されています。
        </p>
        <div class="table-wrap">
          <table class="master-table" id="master-table">
            <thead>
              <tr>
                <th>#</th>
                <th>ボス</th>
                <th>搭乗者</th>
                <th>NT/強化</th>
                <th>武器</th>
                <th>射程(min)</th>
                <th>射程(max)</th>
                <th>属性</th>
                <th>切払</th>
                <th>効果</th>
              </tr>
            </thead>
            <tbody id="master-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <!-- GitHub管理データ -->
  <script src="BossData.js"></script>
  <script src="Boss_BestCompData.js"></script>

  <!-- Firebase Firestore 連携スクリプト -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      setDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      increment,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 共通ヘッダー読み込み（存在する場合）
    fetch('../header.html')
      .then(res => res.ok ? res.text() : '')
      .then(html => { if (html) document.getElementById('common-header').innerHTML = html; })
      .catch(() => {});

    // Uploadページと同一のFirebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyAKnEENO4tuGtFHsTOAWusbUNPzzUiMNMY",
      authDomain: "himitsukessya-aa509.firebaseapp.com",
      projectId: "himitsukessya-aa509",
      storageBucket: "himitsukessya-aa509.appspot.com",
      messagingSenderId: "584936417780",
      appId: "1:584936417780:web:7702b98ea7faf7ccfbb1a1",
      measurementId: "G-9XBXVQN1JC"
    };

    const ADMIN_PASS = "p@ssw0rd";
    const COLLECTION_NAME = "boss_comps";
    const LIKED_STORAGE_KEY = "mst_boss_liked_keys";

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const bossList = (typeof BOSS_DATA !== 'undefined' && Array.isArray(BOSS_DATA)) ? BOSS_DATA : [];
    // キー: "各ボス名(搭乗者名)_投稿No." -> 投稿データ
    let compMap = (typeof BOSS_BEST_COMP_DATA !== 'undefined' && typeof BOSS_BEST_COMP_DATA === 'object')
      ? { ...BOSS_BEST_COMP_DATA }
      : {};
    let likedKeys = JSON.parse(localStorage.getItem(LIKED_STORAGE_KEY)) || [];
    let currentBossId = null;

    // キー生成ヘルパー: "各ボス名(搭乗者名)_投稿No."
    function buildCompKey(bossName, pilot, postNo) {
      const safeName = (bossName || '').trim();
      const safePilot = (pilot || '').trim();
      return `${safeName}(${safePilot})_${postNo}`;
    }

    // リアルタイム購読（Firestoreの変更を全画面へ即時反映）
    onSnapshot(collection(db, COLLECTION_NAME), (snapshot) => {
      const nextMap = {};
      snapshot.forEach((docSnap) => {
        nextMap[docSnap.id] = docSnap.data();
      });
      compMap = nextMap;

      if (!document.getElementById('view-list').classList.contains('hidden')) {
        renderBossGrid();
      }
      if (!document.getElementById('view-detail').classList.contains('hidden') && currentBossId !== null) {
        const boss = bossList.find(b => b.id === currentBossId);
        if (boss) updateNextPostNo(boss);
        renderCompList();
      }
    }, (error) => {
      console.error("Firestore購読エラー:", error);
    });

    // イベント登録
    document.getElementById('tab-list').addEventListener('click', () => switchTab('list'));
    document.getElementById('tab-master').addEventListener('click', () => switchTab('master'));
    document.getElementById('back-to-list-btn').addEventListener('click', () => switchTab('list'));
    document.getElementById('comp-form').addEventListener('submit', submitComp);
    document.getElementById('sort-select').addEventListener('change', renderCompList);
    document.getElementById('export-comp-btn').addEventListener('click', exportCompDataJS);

    // 初期描画
    renderBossGrid();
    renderMasterTable();

    function switchTab(tabName) {
      document.getElementById('view-list').classList.add('hidden');
      document.getElementById('view-detail').classList.add('hidden');
      document.getElementById('view-master').classList.add('hidden');

      document.getElementById('tab-list').classList.remove('active');
      document.getElementById('tab-master').classList.remove('active');

      if (tabName === 'list') {
        document.getElementById('view-list').classList.remove('hidden');
        document.getElementById('tab-list').classList.add('active');
        renderBossGrid();
      } else if (tabName === 'detail') {
        document.getElementById('view-detail').classList.remove('hidden');
        document.getElementById('tab-list').classList.add('active');
      } else if (tabName === 'master') {
        document.getElementById('view-master').classList.remove('hidden');
        document.getElementById('tab-master').classList.add('active');
        renderMasterTable();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function getAttrBadge(attr) {
      if (attr === 'ビーム') return `<span class="badge-attr attr-beam">ビーム</span>`;
      if (attr === '実弾') return `<span class="badge-attr attr-solid">実弾</span>`;
      if (attr === 'ヒート') return `<span class="badge-attr attr-heat">ヒート</span>`;
      return escapeHtml(attr || '-');
    }

    function handleImgError(img, name) {
      img.onerror = null;
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="140" viewBox="0 0 200 140">
        <rect width="200" height="140" fill="#121521"/>
        <text x="50%" y="48%" fill="#9aa3b8" font-size="12" text-anchor="middle" font-family="sans-serif">NO IMAGE</text>
        <text x="50%" y="65%" fill="#f5b041" font-size="11" text-anchor="middle" font-family="sans-serif">${escapeHtml(name)}</text>
      </svg>`;
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    // ① ボス一覧カード描画
    function renderBossGrid() {
      const grid = document.getElementById('boss-grid');
      grid.innerHTML = '';

      bossList.forEach(boss => {
        const count = Object.entries(compMap).filter(([key, c]) => {
          return c.bossId === boss.id || key.startsWith(`${boss.name}(${boss.pilot})_`);
        }).length;

        const card = document.createElement('div');
        card.className = 'boss-card';
        card.addEventListener('click', () => openBossDetail(boss.id));
        card.innerHTML = `
          <div class="boss-img-wrap">
            <span class="boss-no-badge">#${boss.id}</span>
            <img src="${escapeHtml(boss.image)}" alt="${escapeHtml(boss.name)}">
            <span class="post-count-badge">編成 ${count}件</span>
          </div>
          <div class="boss-card-body">
            <div>
              <div class="boss-card-title">${escapeHtml(boss.name)}</div>
              <div class="boss-card-pilot">搭乗者：${escapeHtml(boss.pilot)}</div>
            </div>
            <div class="boss-card-sub">${escapeHtml(boss.weapon)}（射程 ${boss.rangeMin}-${boss.rangeMax}）</div>
          </div>
        `;
        const imgEl = card.querySelector('img');
        imgEl.addEventListener('error', () => handleImgError(imgEl, boss.name));
        grid.appendChild(card);
      });
    }

    // ② 個別ボス攻略画面を開く
    function openBossDetail(bossId) {
      currentBossId = bossId;
      const boss = bossList.find(b => b.id === bossId);
      if (!boss) return;

      const detailDiv = document.getElementById('boss-detail-content');
      detailDiv.innerHTML = `
        <div class="boss-hero-banner">
          <div class="boss-hero-img">
            <img src="${escapeHtml(boss.image)}" alt="${escapeHtml(boss.name)}">
          </div>
          <div class="boss-hero-info">
            <span class="raid-alert">WARNING // RAID BOSS #${boss.id}</span>
            <h2>${escapeHtml(boss.name)}</h2>
            <div class="boss-hero-pilot">パイロット：${escapeHtml(boss.pilot)} ${boss.nt ? `（${escapeHtml(boss.nt)}）` : ''}</div>
            <table class="spec-table">
              <tr>
                <th>使用武器</th>
                <td><strong>${escapeHtml(boss.weapon)}</strong></td>
                <th>属性</th>
                <td>${getAttrBadge(boss.attribute)}</td>
              </tr>
              <tr>
                <th>射程</th>
                <td>${boss.rangeMin} ～ ${boss.rangeMax}</td>
                <th>切払</th>
                <td>${escapeHtml(boss.cut || 'なし')}</td>
              </tr>
              <tr>
                <th>特殊効果</th>
                <td colspan="3" style="color: var(--accent-gold);">${escapeHtml(boss.effect || '特になし')}</td>
              </tr>
            </table>
          </div>
        </div>
      `;
      const heroImg = detailDiv.querySelector('.boss-hero-img img');
      heroImg.addEventListener('error', () => handleImgError(heroImg, boss.name));

      updateNextPostNo(boss);
      renderCompList();
      switchTab('detail');
    }

    // 次の投稿No.を計算（"各ボス名(搭乗者名)_投稿No." の重複を防ぐ）
    function updateNextPostNo(boss) {
      const prefix = `${boss.name}(${boss.pilot})_`;
      let maxNo = 0;

      Object.entries(compMap).forEach(([key, val]) => {
        if (key.startsWith(prefix) || (val.bossName === boss.name && val.pilot === boss.pilot)) {
          const noVal = Number(val.postNo) || 0;
          if (noVal > maxNo) maxNo = noVal;
        }
      });

      document.getElementById('f-postNo').value = maxNo + 1;
    }

    // 攻略編成の投稿（Firestoreへ保存）
    async function submitComp(e) {
      e.preventDefault();
      const boss = bossList.find(b => b.id === currentBossId);
      if (!boss) return;

      const checkedHps = Array.from(document.querySelectorAll('input[name="hpCond"]:checked')).map(cb => cb.value);
      if (checkedHps.length === 0) {
        alert('「ボス残りHP割合」を1つ以上チェックしてください。');
        return;
      }

      const postNo = Number(document.getElementById('f-postNo').value);
      const uniqueKey = buildCompKey(boss.name, boss.pilot, postNo);

      if (compMap[uniqueKey]) {
        alert('投稿No.が重複しています。再度お試しください。');
        updateNextPostNo(boss);
        return;
      }

      const submitBtn = document.getElementById('submit-comp-btn');
      submitBtn.disabled = true;
      submitBtn.textContent = '送信中...';

      try {
        const now = new Date();
        const timestamp = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

        const newComp = {
          bossId: boss.id,
          bossName: boss.name,
          pilot: boss.pilot,
          postNo: postNo,
          hpConditions: checkedHps,
          unitName: document.getElementById('f-unitName').value.trim(),
          unitCustom: document.getElementById('f-unitCustom').value.trim(),
          weapon: document.getElementById('f-weapon').value.trim(),
          equipment: document.getElementById('f-equipment').value.trim(),
          trait: document.getElementById('f-trait').value.trim(),
          author: document.getElementById('f-author').value.trim(),
          comment: document.getElementById('f-comment').value.trim(),
          password: document.getElementById('f-password').value.trim(),
          timestamp: timestamp,
          likes: 0,
          createdAt: serverTimestamp()
        };

        await setDoc(doc(db, COLLECTION_NAME, uniqueKey), newComp);

        document.getElementById('comp-form').reset();
        updateNextPostNo(boss);
        alert('攻略編成を投稿しました！');
      } catch (error) {
        console.error("投稿エラー:", error);
        alert('投稿に失敗しました。通信状況やFirestoreのルールを確認してください。');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '編成を投稿する';
      }
    }

    // 攻略編成一覧の描画
    function renderCompList() {
      const listDiv = document.getElementById('comp-list');
      const sortType = document.getElementById('sort-select').value;
      const boss = bossList.find(b => b.id === currentBossId);
      if (!boss) return;

      const prefix = `${boss.name}(${boss.pilot})_`;
      let items = Object.entries(compMap)
        .filter(([key, val]) => key.startsWith(prefix) || val.bossId === currentBossId)
        .map(([key, val]) => ({ key, ...val }));

      if (sortType === 'likes') {
        items.sort((a, b) => (b.likes || 0) - (a.likes || 0) || (b.postNo || 0) - (a.postNo || 0));
      } else if (sortType === 'newest') {
        items.sort((a, b) => (b.postNo || 0) - (a.postNo || 0));
      } else {
        items.sort((a, b) => (a.postNo || 0) - (b.postNo || 0));
      }

      if (items.length === 0) {
        listDiv.innerHTML = `<p style="color:var(--text-muted); text-align:center; padding:20px;">まだ攻略編成の投稿がありません。最初の攻略情報を投稿してみましょう！</p>`;
        return;
      }

      listDiv.innerHTML = items.map(item => {
        const isLiked = likedKeys.includes(item.key);
        const hpBadges = (item.hpConditions || []).map(hp => `<span class="hp-tag">${escapeHtml(hp)}</span>`).join('');

        return `
          <div class="comp-card">
            <div class="comp-top">
              <div class="comp-meta">
                <span style="color:var(--accent-gold); font-weight:bold;">No.${item.postNo}</span> ｜ 
                投稿者：<strong>${escapeHtml(item.author)}</strong>
              </div>
              <div class="comp-meta">${escapeHtml(item.timestamp || '')}</div>
            </div>
            <div class="hp-tags">${hpBadges}</div>
            <div class="comp-specs">
              <div><span>機体名</span><strong>${escapeHtml(item.unitName)}</strong></div>
              <div><span>機体カスタム</span>${escapeHtml(item.unitCustom || '-')}</div>
              <div><span>武器</span><strong>${escapeHtml(item.weapon)}</strong></div>
              <div><span>装備</span>${escapeHtml(item.equipment)}</div>
              <div><span>特性</span>${escapeHtml(item.trait || '-')}</div>
            </div>
            ${item.comment ? `<div class="comp-comment">${escapeHtml(item.comment)}</div>` : ''}
            <div class="comp-actions">
              <button type="button" class="like-btn ${isLiked ? 'liked' : ''}" data-key="${escapeHtml(item.key)}">
                <span class="heart-icon">${isLiked ? '❤' : '♡'}</span>
                <span>いいね！</span>
                <strong>${item.likes || 0}</strong>
              </button>
              <button type="button" class="del-btn" data-key="${escapeHtml(item.key)}">削除</button>
            </div>
          </div>
        `;
      }).join('');

      listDiv.querySelectorAll('.like-btn').forEach(btn => {
        btn.addEventListener('click', () => toggleLike(btn.dataset.key));
      });
      listDiv.querySelectorAll('.del-btn').forEach(btn => {
        btn.addEventListener('click', () => deleteComp(btn.dataset.key));
      });
    }

    // いいね処理（同一ブラウザでの連続加算を防止・1回制限トグル）
    async function toggleLike(key) {
      if (!compMap[key]) return;
      const idx = likedKeys.indexOf(key);
      const isCurrentlyLiked = idx !== -1;
      const delta = isCurrentlyLiked ? -1 : 1;

      try {
        await updateDoc(doc(db, COLLECTION_NAME, key), {
          likes: increment(delta)
        });

        if (isCurrentlyLiked) {
          likedKeys.splice(idx, 1);
        } else {
          likedKeys.push(key);
        }
        localStorage.setItem(LIKED_STORAGE_KEY, JSON.stringify(likedKeys));
      } catch (error) {
        console.error("いいね更新エラー:", error);
        alert('いいねの更新に失敗しました。');
      }
    }

    // 投稿削除
    async function deleteComp(key) {
      const target = compMap[key];
      if (!target) return;

      const inputPw = prompt('削除するには投稿時の4桁パスワード（または管理者PW）を入力してください：');
      if (inputPw === null) return;

      if (inputPw === target.password || inputPw === ADMIN_PASS) {
        try {
          await deleteDoc(doc(db, COLLECTION_NAME, key));
          alert('投稿を削除しました。');
        } catch (error) {
          console.error("削除エラー:", error);
          alert('削除に失敗しました。');
        }
      } else {
        alert('パスワードが一致しません。');
      }
    }

    // Boss_BestCompData.js 出力
    function exportCompDataJS() {
      const exportObj = {};
      Object.entries(compMap).forEach(([key, val]) => {
        const { createdAt, ...rest } = val;
        exportObj[key] = rest;
      });
      const content = `// Boss/Boss_BestCompData.js\n// 攻略編成データ（キー: "各ボス名(搭乗者名)_投稿No."）\n\nconst BOSS_BEST_COMP_DATA = ${JSON.stringify(exportObj, null, 2)};\n`;
      const blob = new Blob([content], { type: 'text/javascript;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Boss_BestCompData.js';
      a.click();
      URL.revokeObjectURL(url);
    }

    // ③ ボス情報まとめテーブル描画（閲覧専用）
    function renderMasterTable() {
      const tbody = document.getElementById('master-tbody');
      tbody.innerHTML = '';

      bossList.forEach(boss => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${boss.id}</td>
          <td><strong>${escapeHtml(boss.name)}</strong></td>
          <td>${escapeHtml(boss.pilot)}</td>
          <td>${escapeHtml(boss.nt)}</td>
          <td>${escapeHtml(boss.weapon)}</td>
          <td>${boss.rangeMin}</td>
          <td>${boss.rangeMax}</td>
          <td>${getAttrBadge(boss.attribute)}</td>
          <td>${escapeHtml(boss.cut)}</td>
          <td>${escapeHtml(boss.effect)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
