<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Hunter Chance - 秘密結社の部屋</title>
    
    <!-- 外部ライブラリの読み込み -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <style>
        :root {
            --bg-color: #1a1c1e;
            --accent-color: #00d4ff;
            --text-color: #e0e0e0;
            --card-bg: #25282c;
            --border-color: #444;
        }

        html, body {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; font-family: "Meiryo", sans-serif;
        }

        /* 共通ヘッダー */
        header {
            background: rgba(0,0,0,0.95); height: 60px; display: flex; 
            justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 1000; 
            border-bottom: 2px solid var(--accent-color); padding: 0 15px; box-sizing: border-box;
        }

        .nav-item-custom {
            color: #e0e0e0; text-decoration: none; font-size: 0.85rem; 
            padding: 6px 10px; border-radius: 4px; border: 1px solid transparent;
            transition: 0.2s;
        }
        .nav-item-custom:hover { background: rgba(0, 212, 255, 0.2); border-color: #00d4ff; }

        /* タブエリア */
        .top-section {
            background: var(--bg-color); border-bottom: 2px solid var(--accent-color);
            padding: 10px 20px 0 20px; box-sizing: border-box;
        }

        .tabs-container { display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; }
        .tab-btn {
            padding: 8px 18px; background: #333; border: none;
            color: var(--text-color); cursor: pointer; border-radius: 4px 4px 0 0;
            font-size: 0.85rem; transition: 0.2s;
        }
        .tab-btn.active { background: var(--accent-color); color: #000; font-weight: bold; }

        /* メインコンテンツ */
        .main-content {
            height: calc(100% - 110px); overflow-y: auto; padding: 20px; box-sizing: border-box;
        }

        /* 今日のHC ツールデザイン */
        .tool-container {
            max-width: 850px; margin: 0 auto; background: var(--card-bg);
            padding: 25px; border-radius: 12px; border: 1px solid var(--accent-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .tool-section { margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #444; }
        .tool-section:last-child { border-bottom: none; }
        .tool-title { color: var(--accent-color); font-weight: bold; margin-bottom: 15px; display: block; font-size: 1.1rem; }
        
        .calc-input {
            width: 100%; max-width: 350px; padding: 12px; background: #111;
            border: 1px solid var(--accent-color); color: white; border-radius: 4px; font-size: 1rem;
        }
        .result-box { margin-top: 15px; padding: 15px; background: rgba(0, 212, 255, 0.1); border-left: 4px solid var(--accent-color); font-size: 1.1rem; }
        
        .unit-rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 10px; }
        .unit-card { background: #1a1c1e; padding: 12px; border: 1px solid #444; border-radius: 6px; margin-bottom: 8px; }
        .rank-badge { display: inline-block; width: 24px; height: 24px; background: var(--accent-color); color: #000; text-align: center; line-height: 24px; border-radius: 50%; font-weight: bold; margin-right: 10px; font-size: 0.8rem; }
        .unit-val { display: block; color: #888; font-size: 0.85rem; margin-top: 5px; }

        /* その他スタイル */
        #text-content-display { white-space: pre-wrap; line-height: 1.6; }
        #content-frame { width: 100%; height: 100%; border: none; }
        .hayami-container { max-width: 900px; margin: 0 auto; background: var(--card-bg); padding: 20px; border: 1px solid var(--accent-color); }
        .hayami-table { width: 100%; border-collapse: collapse; text-align: center; }
        .hayami-table th { background: var(--accent-color); color: #000; padding: 10px; }
        .hayami-table td { border: 1px solid #444; padding: 8px; }
    </style>
</head>
<body>

<header>
    <a href="index.html#main" style="text-decoration:none; font-weight:bold; font-size:1.1rem; color:var(--accent-color);">秘密結社の部屋</a>
    <nav style="display:flex; gap:10px; overflow-x:auto;">
        <a href="unit.html" class="nav-item-custom">Unit</a>
        <a href="derivatives.html" class="nav-item-custom">Derivatives</a>
        <a href="arms.html" class="nav-item-custom">Arms</a>
        <a href="hangar.html" class="nav-item-custom">Hangar</a>
        <a href="battle.html" class="nav-item-custom">Battle</a>
        <a href="novels.html" class="nav-item-custom">Novels</a>
        <a href="tactics.html" class="nav-item-custom">Tactics</a>
        <a href="hunter.html" class="nav-item-custom">Hunter</a>
        <a href="trivia.html" class="nav-item-custom">Trivia</a>
        <a href="emoji.html" class="nav-item-custom">Emoji</a>
        <a href="link.html" class="nav-item-custom">Link</a>
    </nav>
</header>

<div class="top-section">
    <div class="tabs-container">
        <button class="tab-btn active" data-type="today">今日のHC</button>
        <button class="tab-btn" data-type="txt" data-file="特殊戦闘（HCやスクランブルなど）.txt">特殊戦闘</button>
        <button class="tab-btn" data-type="html" data-file="hunter_info.html">HCについて</button>
        <button class="tab-btn" data-type="static">HC加算値早見表</button>
    </div>
</div>

<div class="main-content">
    <div id="today-tool" class="tool-container">
        <div class="tool-section">
            <span class="tool-title">① 今日の最初のHCを計算</span>
            <input type="number" id="input-battle" class="calc-input" placeholder="前日の最終戦闘数を入力...">
            <div id="calc-res" class="result-box">前日の数値を入力してください</div>
        </div>

        <div class="tool-section">
            <span class="tool-title">② 今日の加算値・出現No</span>
            <div id="today-info" style="font-size: 1.2rem;">取得中...</div>
        </div>

        <div class="tool-section">
            <span class="tool-title">③ 🎯今日の大当たり！</span>
            <div id="unit-error" style="color: #ff5555; margin-bottom: 10px; display: none;"></div>
            <div class="unit-rank-grid">
                <div>
                    <div style="color: #00d4ff; font-size: 0.9rem; border-bottom: 1px solid #00d4ff; margin-bottom: 10px; padding-bottom: 5px;">名声ランキング ベスト3</div>
                    <div id="rank-fame">解析中...</div>
                </div>
                <div>
                    <div style="color: #ffeb3b; font-size: 0.9rem; border-bottom: 1px solid #ffeb3b; margin-bottom: 10px; padding-bottom: 5px;">ポイントランキング ベスト3</div>
                    <div id="rank-point">解析中...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="text-content-display" style="display:none;"></div>
    <iframe id="content-frame" style="display:none;"></iframe>
    <div id="static-table-area" class="hayami-container" style="display:none;">
        <table class="hayami-table" id="hayami-data">
            <thead><tr><th>暦</th><th>加算値</th><th>出現No</th></tr></thead>
            <tbody>
                <!-- hunter_data.js から自動的に中身が埋め込まれます -->
            </tbody>
        </table>
    </div>
</div>

<!-- 分割したJSファイルを読み込む -->
<script src="hunter_data.js"></script>
<script src="hunter_script.js"></script>

<script data-goatcounter="https://bobs-base.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
