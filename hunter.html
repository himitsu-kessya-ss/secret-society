<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Hunter Chance - 秘密結社の部屋</title>
    
    <!-- 外部ライブラリの読み込み -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <!-- 専用のCSSファイルを読み込み -->
    <link rel="stylesheet" href="hunter.css">
</head>
<body>

<!-- ▼ 共通ヘッダーが自動でここに読み込まれます -->
<div id="header-container" style="width: 100%;"></div>

<div class="top-section">
    <div class="tabs-container">
        <button class="tab-btn active" data-type="today">今日のHC</button>
        <button class="tab-btn" data-type="txt" data-file="特殊戦闘（HCやスクランブルなど）.txt">特殊戦闘</button>
        <button class="tab-btn" data-type="html" data-file="hunter_info.html">HCについて</button>
        <button class="tab-btn" data-type="static">HC加算値早見表</button>
    </div>
</div>

<div class="main-content">
    <div id="today-tool" class="tool-container">
        <div class="tool-section">
            <span class="tool-title">① 今日の最初のHCを計算</span>
            <input type="number" id="input-battle" class="calc-input" placeholder="前日の最終戦闘数を入力...">
            <div id="calc-res" class="result-box">前日の数値を入力してください</div>

            <!-- ＋1500戦までのスケジュール表を表示するエリア -->
            <div id="schedule-area" style="margin-top: 20px; display: none;">
                <div style="font-weight: bold; color: #00d4ff; margin-bottom: 5px;">📊 入力した戦闘回数 ＋1500戦までのスケジュール</div>
                <div class="schedule-subtext">※HCは本日の加算値（周期）をベースに計算し、スクランブルは総戦闘回数の158戦周期で表示します。</div>
                <table class="hc-schedule-table" id="schedule-table">
                    <thead>
                        <tr>
                            <th>戦闘回数</th>
                            <th>HC</th>
                            <th>スクランブル</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- JavaScriptで動的に挿入されます -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="tool-section">
            <span class="tool-title">② 今日の加算値・出現No</span>
            <div id="today-info" style="font-size: 1.2rem;">取得中...</div>
        </div>

        <div class="tool-section">
            <span class="tool-title">③ 🎯今日の大当たり！</span>
            <div id="unit-error" style="color: #ff5555; margin-bottom: 10px; display: none;"></div>
            <div class="unit-rank-grid">
                <div>
                    <div style="color: #00d4ff; font-size: 0.9rem; border-bottom: 1px solid #00d4ff; margin-bottom: 10px; padding-bottom: 5px;">総名声ランキング ベスト3</div>
                    <div id="rank-fame">解析中...</div>
                </div>
                <div>
                    <div style="color: #ffeb3b; font-size: 0.9rem; border-bottom: 1px solid #ffeb3b; margin-bottom: 10px; padding-bottom: 5px;">総クレジットランキング ベスト3</div>
                    <div id="rank-point">解析中...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="text-content-display" style="display:none;"></div>
    <iframe id="content-frame" style="display:none;"></iframe>
    <div id="static-table-area" class="hayami-container" style="display:none;">
        <table class="hayami-table" id="hayami-data">
            <thead><tr><th>暦</th><th>加算値</th><th>出現No</th></tr></thead>
            <tbody>
                <!-- hunter_data.js から自動的に中身が埋め込まれます -->
            </tbody>
        </table>
    </div>
</div>

<!-- 共通ヘッダーを読み込んで現在地をアクティブにする処理 -->
<script>
    fetch('header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header-container').innerHTML = data;
            
            const currentPath = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll('.nav-links a');
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
</script>

<!-- 分割したJSファイルを読み込む -->
<script src="hunter_data.js"></script>
<script src="hunter.js"></script>

<script data-goatcounter="https://bobs-base.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
