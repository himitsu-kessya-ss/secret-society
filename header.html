        <a href="/secret-society/route/" class="nav-item-custom">Route</a>
        <a href="/secret-society/arms/" class="nav-item-custom">Arms</a>
        <a href="/secret-society/hangar/" class="nav-item-custom" style="display: none;">Hangar</a>
        <a href="/secret-society/seiryoku-p/" class="nav-item-custom">Seiryoku-P</a>
        <a href="/secret-society/upload/" class="nav-item-custom">Upload</a>
        <a href="/secret-society/battles/" class="nav-item-custom">Battle</a>

    </nav>

    <!-- アクセスカウンター表示エリア -->
    <div class="access-counter">
        <span class="counter-label">ACCESS</span>
        <span id="visitor-counter" class="counter-digits">000000</span>
    </div>
</header>

<style>
    header {
        background-color: rgba(0, 0, 0, 0.95);
        height: 60px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 2px solid #00d4ff;
        padding: 0 15px;
        box-sizing: border-box;
    }
    .logo-link {
        text-decoration: none;
        font-weight: bold;
        font-size: 1.1rem;
        color: #00d4ff;
        white-space: nowrap;
    }
    .nav-links {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        white-space: nowrap;
        margin-right: 15px; 
    }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-item-custom {
        color: #e0e0e0; 
        text-decoration: none; 
        font-size: 0.85rem; 
        padding: 6px 10px; 
        border-radius: 4px; 
        border: 1px solid transparent;
        transition: 0.2s;
    }
    .nav-item-custom:hover, .nav-item-custom.active { 
        background: rgba(0, 212, 255, 0.2); 
        border-color: #00d4ff; 
    }

    /* アクセスカウンターのデザイン */
    .access-counter {
        display: flex;
        align-items: center;
        background: #050a10;
        border: 1px solid #00d4ff;
        padding: 4px 8px;
        border-radius: 4px;
        font-family: 'Courier New', Courier, monospace;
        box-shadow: inset 0 0 5px rgba(0, 212, 255, 0.3);
        white-space: nowrap;
        flex-shrink: 0;
    }

    .counter-label {
        font-size: 0.65rem;
        color: #00d4ff;
        margin-right: 6px;
        letter-spacing: 1px;
        font-weight: bold;
        opacity: 0.8;
    }

    .counter-digits {
        color: #00d4ff;
        font-weight: bold;
        font-size: 0.95rem;
        letter-spacing: 2px;
        text-shadow: 0 0 6px rgba(0, 212, 255, 0.6);
    }

    @media (max-width: 768px) {
        .access-counter {
            display: none;
        }
    }
</style>

<!-- ヘッダーが読み込まれたあとに確実に実行されるカウンター処理 -->
<script>
(function() {
    // 現在のページのパス（例: /secret-society/briefing/index.html など）を固有のキーにする
    const currentPath = window.location.pathname;
    const pageKey = 'secret_counter_' + currentPath;

    // ブラウザの保存領域（localStorage）から現在のカウントを取得
    let count = localStorage.getItem(pageKey);
    
    if (!count) {
        count = 120; // 初回アクセスの初期値
    } else {
        count = parseInt(count, 10) + 1;
    }
    
    // 更新した数値を保存
    localStorage.setItem(pageKey, count);

    // 6桁のゼロ埋め形式（例: 000121）に変換
    const paddedCount = String(count).padStart(6, '0');
    
    // 画面上のカウンター要素に反映（少し遅延させて確実に対象要素を取得）
    setTimeout(() => {
        const counterElement = document.getElementById('visitor-counter');
        if (counterElement) {
            counterElement.textContent = paddedCount;
        }
    }, 50);
})();
</script>
