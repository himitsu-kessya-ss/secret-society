<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>レイドボス攻略データベース | -Secret Society-</title>
  <link rel="stylesheet" href="boss.css">
</head>
<body>
  <div id="common-header"></div>

  <div class="container">
    <header class="page-header">
      <h1>RAID BOSS ARCHIVE</h1>
      <p>レイドボス攻略データベース ＆ 推奨編成共有システム</p>
    </header>

    <nav class="nav-tabs">
      <button class="tab-btn active" id="tab-list">🎯 レイドボス一覧</button>
      <button class="tab-btn" id="tab-master">📊 ボス情報まとめ</button>
    </nav>

    <!-- ① ボス一覧 -->
    <section id="view-list">
      <div class="boss-grid" id="boss-grid">
        <p class="loading-text">ボスデータを読み込み中...</p>
      </div>
    </section>

    <!-- ② 個別ボス攻略 -->
    <section id="view-detail" class="hidden">
      <button class="back-btn" id="back-to-list-btn">← ボス一覧に戻る</button>
      <div id="boss-detail-content"></div>

      <div class="panel-box" id="comp-form-panel">
        <h3 class="panel-title" id="form-panel-title">📝 攻略編成を投稿する</h3>
        <form id="comp-form">
          <div class="form-grid">
            <div class="form-group full-width">
              <label>地形（複数チェック可）</label>
              <div class="checkbox-group">
                <label><input type="checkbox" name="terrainCond" value="地上"> 地上</label>
                <label><input type="checkbox" name="terrainCond" value="海洋"> 海洋</label>
                <label><input type="checkbox" name="terrainCond" value="宇宙"> 宇宙</label>
                <label><input type="checkbox" name="terrainCond" value="空中"> 空中</label>
                <label><input type="checkbox" name="terrainCond" value="砂漠"> 砂漠</label>
                <label><input type="checkbox" name="terrainCond" value="月面"> 月面</label>
                <label><input type="checkbox" name="terrainCond" value="大気圏"> 大気圏</label>
                <label><input type="checkbox" name="terrainCond" value="森林"> 森林</label>
                <label><input type="checkbox" name="terrainCond" value="夜戦"> 夜戦</label>
                <label><input type="checkbox" name="terrainCond" value="仮想空間"> 仮想空間</label>
              </div>
            </div>
            <div class="form-group full-width">
              <label>重量クラス（複数チェック可）</label>
              <div class="checkbox-group">
                <label><input type="checkbox" name="weightCond" value="軽"> 軽</label>
                <label><input type="checkbox" name="weightCond" value="中"> 中</label>
                <label><input type="checkbox" name="weightCond" value="重"> 重</label>
              </div>
            </div>
            <div class="form-group full-width">
              <label>ボス残りHP割合（複数チェック可）<span class="req-mark">*</span></label>
              <div class="checkbox-group">
                <label><input type="checkbox" name="hpCond" value="残り５割以上"> 残り５割以上</label>
                <label><input type="checkbox" name="hpCond" value="残り５割未満"> 残り５割未満</label>
                <label><input type="checkbox" name="hpCond" value="残り３割以下"> 残り３割以下</label>
              </div>
            </div>
            <div class="form-group">
              <label>機体名<span class="req-mark">*</span></label>
              <input type="text" id="f-unitName" required placeholder="例：Zガンダム">
            </div>
            <div class="form-group">
              <label>機体カスタム（任意）</label>
              <input type="text" id="f-unitCustom" placeholder="例：機動カスタム">
            </div>
            <div class="form-group">
              <label>武器<span class="req-mark">*</span></label>
              <input type="text" id="f-weapon" required placeholder="例：ハイパー・メガ・ランチャー">
            </div>
            <div class="form-group">
              <label>装備<span class="req-mark">*</span></label>
              <input type="text" id="f-equipment" required placeholder="例：バイオセンサー">
            </div>
            <div class="form-group">
              <label>移動戦術<span class="req-mark">*</span></label>
              <select id="f-moveTactic" required>
                <option value="">選択してください</option>
                <option value="足止め">足止め</option>
                <option value="移動意識">移動意識</option>
                <option value="移動しない">移動しない</option>
              </select>
            </div>
            <div class="form-group">
              <label>特性（任意）</label>
              <input type="text" id="f-trait" placeholder="例：NT覚醒">
            </div>
            <div class="form-group">
              <label>投稿No.（自動採番）</label>
              <input type="text" id="f-postNo" readonly class="readonly-no">
            </div>
            <div class="form-group">
              <label>投稿者名<span class="req-mark">*</span></label>
              <input type="text" id="f-author" required placeholder="パイロット名">
            </div>
            <div class="form-group">
              <label>投稿PW（4桁数字・編集/削除用）<span class="req-mark">*</span></label>
              <input type="password" id="f-password" required pattern="\d{4}" maxlength="4" placeholder="1234">
            </div>
            <div class="form-group full-width">
              <label>コメント（任意）</label>
              <textarea id="f-comment" rows="2" placeholder="立ち回りや注意点など"></textarea>
            </div>
          </div>
          <div class="form-btn-row">
            <button type="submit" class="btn-primary" id="submit-comp-btn">編成を投稿する</button>
            <button type="button" class="btn-secondary hidden" id="cancel-edit-btn">編集をキャンセル</button>
          </div>
        </form>
      </div>

      <div class="panel-box">
        <div class="comp-header-bar">
          <h3 class="panel-title no-margin">⚔️ 投稿された攻略編成一覧</h3>
          <div class="filter-controls">
            <select id="filter-terrain" aria-label="地形フィルター">
              <option value="">地形：すべて</option>
              <option value="地上">地形：地上</option>
              <option value="海洋">地形：海洋</option>
              <option value="宇宙">地形：宇宙</option>
              <option value="空中">地形：空中</option>
              <option value="砂漠">地形：砂漠</option>
              <option value="月面">地形：月面</option>
              <option value="大気圏">地形：大気圏</option>
              <option value="森林">地形：森林</option>
              <option value="夜戦">地形：夜戦</option>
              <option value="仮想空間">地形：仮想空間</option>
            </select>
            <select id="filter-weight" aria-label="重量クラスフィルター">
              <option value="">重量：すべて</option>
              <option value="軽">重量：軽</option>
              <option value="中">重量：中</option>
              <option value="重">重量：重</option>
            </select>
            <select id="sort-select" aria-label="並び替え">
              <option value="likes">いいね数の多い順</option>
              <option value="newest">新しい順（投稿No.降順）</option>
              <option value="oldest">古い順（投稿No.昇順）</option>
            </select>
            <button type="button" class="btn-secondary" id="export-comp-btn">💾 boss_best_comp_data.js 出力</button>
          </div>
        </div>
        <div id="comp-list">
          <p class="loading-text">データを読み込み中...</p>
        </div>
      </div>
    </section>

    <!-- ③ ボス情報まとめ -->
    <section id="view-master" class="hidden">
      <div class="panel-box">
        <h3 class="panel-title">📊 ボス情報まとめ一覧</h3>
        <p class="master-note">※<code>boss/boss_list.csv</code> を読み込んで表示しています。</p>
        <div class="table-wrap">
          <table class="master-table">
            <thead>
              <tr>
                <th>#</th><th>ボス</th><th>搭乗者</th><th>NT/強化</th><th>武器</th>
                <th>射程(min)</th><th>射程(max)</th><th>属性</th><th>切払</th><th>効果</th>
              </tr>
            </thead>
            <tbody id="master-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script src="boss_best_comp_data.js"></script>
  <script type="module" src="boss.js"></script>
</body>
</html>
