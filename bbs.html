<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>秘密結社BBS - 秘密結社の部屋</title>
    <!-- BBSページ専用のCSSを読み込み -->
    <link rel="stylesheet" href="bbs.css">
</head>
<body>

    <!-- ▼ 共通ヘッダーが自動でここに読み込まれます -->
    <div id="header-container"></div>

    <div class="container">
        <h1 class="page-title">💬 秘密結社BBS（攻略掲示板）</h1>

        <!-- 検索バー -->
        <div class="controls-row">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 過去の投稿やキーワードで検索..." oninput="filterPosts()">
        </div>

        <!-- 新規スレッド作成フォーム -->
        <div class="post-form-card">
            <h2>新規スレッド作成</h2>
            
            <div class="account-badge-box">
                <div class="account-badge-avatar" id="current-user-avatar">👤</div>
                <div class="account-badge-info">
                    <div>ログイン中のキャラクター: <span id="current-user-name">読み込み中...</span></div>
                    <div style="font-size: 0.75rem; color: var(--sub-text);">※この名前とアバターで投稿されます（<a href="account.html" style="color: var(--accent-color);">変更はこちら</a>）</div>
                </div>
            </div>

            <div class="form-group">
                <label for="contentInput">投稿文（攻略法や質問など）</label>
                <textarea id="contentInput" placeholder="例：〇〇ステージのボス攻略情報を共有します！"></textarea>
            </div>
            <div class="form-group">
                <label for="imageInput">画像を添付（複数選択可）</label>
                <input type="file" id="imageInput" accept="image/*" multiple>
            </div>
            <button class="submit-btn" onclick="createPost()">スレッドを投稿する</button>
        </div>

        <!-- スレッド一覧表示エリア -->
        <div id="loading-msg">読み込み中...</div>
        <div id="threadList"></div>
    </div>

    <!-- 共通ヘッダーを読み込んで現在地をアクティブにする処理 -->
    <script>
        fetch('header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-container').innerHTML = data;
                
                // 現在開いているページを自動判定してナビに active クラスをつける
                const currentPath = window.location.pathname.split('/').pop();
                const navLinks = document.querySelectorAll('.nav-links a');
                navLinks.forEach(link => {
                    if (link.getAttribute('href') === currentPath) {
                        link.classList.add('active');
                    }
                });
            });
    </script>

    <!-- 外部JavaScriptファイルの読み込み -->
    <script src="bbs_data.js"></script>
    <script src="bbs_logic.js"></script>
</body>
</html>
