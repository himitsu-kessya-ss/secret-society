<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MS Tactics - 機体データ投稿＆一覧データベース</title>
  <!-- OCR解析ライブラリ (Tesseract.js) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    /* ===================================================
       基本スタイルの設定
       =================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121519;
      color: #ffffff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    /* メインコンテナ */
    .main-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* パネル共通デザイン */
    .panel {
      background-color: #1e222b;
      border: 1px solid #2a303c;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h2 {
      font-size: 1.2rem;
      color: #00f0ff;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ===================================================
       投稿・入力フォームエリア
       =================================================== */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.85rem;
      color: #00f0ff;
      font-weight: bold;
    }

    input[type="text"] {
      background-color: #15181e;
      border: 1px solid #2a303c;
      border-radius: 4px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 6px rgba(0, 240, 255, 0.3);
    }

    /* 画像OCR読込エリア */
    .ocr-upload-area {
      background-color: #15181e;
      border: 2px dashed #00f0ff;
      border-radius: 6px;
      padding: 16px;
      text-align: center;
      margin-bottom: 20px;
    }

    .file-input {
      display: none;
    }

    .btn-ocr {
      display: inline-block;
      background-color: rgba(0, 240, 255, 0.1);
      color: #00f0ff;
      border: 1px solid #00f0ff;
      padding: 8px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      transition: all 0.2s ease;
    }

    .btn-ocr:hover {
      background-color: rgba(0, 240, 255, 0.25);
    }

    .ocr-status {
      margin-top: 8px;
      font-size: 0.85rem;
      color: #ffd700;
    }

    /* 投稿送信ボタン */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #00f0ff, #0088cc);
      color: #001520;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 240, 255, 0.3);
    }

    .btn-submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* ===================================================
       登録済み機体一覧データ（テーブル ＆ 検索バー）
       =================================================== */
    .db-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      background-color: #15181e;
      border: 1px solid #00f0ff;
      border-radius: 20px;
      padding: 8px 16px 8px 36px;
      color: #ffffff;
      font-size: 0.9rem;
      width: 280px;
      outline: none;
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
    }

    .table-wrapper {
      overflow-x: auto;
      border-bottom: 2px solid #00f0ff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      color: #00f0ff;
      font-size: 0.95rem;
      padding: 12px 16px;
      border-bottom: 2px solid #00f0ff;
      white-space: nowrap;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid #2a303c;
      vertical-align: middle;
    }

    .unit-no {
      border: 1px solid #00f0ff;
      color: #00f0ff;
      border-radius: 4px;
      padding: 2px 8px;
      font-family: monospace;
    }

    .unit-name {
      font-weight: bold;
      color: #ffffff;
    }

    /* 特殊能力バッジ設定 */
    .ability-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 520px;
    }

    .ability-tag {
      display: inline-flex;
      align-items: center;
      border: 1px solid #ffd700;
      border-radius: 4px;
      background-color: rgba(255, 215, 0, 0.05);
      padding: 2px 6px 2px 2px;
      font-size: 0.82rem;
      color: #ffd700;
    }

    .ability-no {
      background-color: #00f0ff;
      color: #003344;
      font-weight: bold;
      font-size: 0.75rem;
      padding: 1px 4px;
      border-radius: 3px;
      margin-right: 5px;
    }

    .btn-view {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      background: transparent;
      padding: 5px 12px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
    }

    .btn-view:hover {
      background-color: rgba(0, 240, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="main-container">

    <!-- 1. 投稿入力フォームパネル -->
    <div class="panel">
      <h2>📝 機体データの新規投稿・登録</h2>

      <!-- OCR画像アップロード枠 -->
      <div class="ocr-upload-area">
        <label class="btn-ocr">
          📷 画像から自動読み込み (OCR)
          <input type="file" id="imageInput" class="file-input" accept="image/*" onchange="processOcrImage(event)">
        </label>
        <div id="ocrStatus" class="ocr-status">裏データベース画像をアップロードすると、下の入力欄へ自動でセットされます</div>
      </div>

      <!-- 入力フォーム -->
      <form id="postForm" onsubmit="handleFormSubmit(event)">
        <div class="form-grid">
          <div class="form-group">
            <label for="inputNo">機体 No.</label>
            <input type="text" id="inputNo" placeholder="例: 7937" required>
          </div>

          <div class="form-group">
            <label for="inputName">機体名</label>
            <input type="text" id="inputName" placeholder="例: デスティニーガンダム SpecII" required>
          </div>

          <div class="form-group full-width">
            <label for="inputAbilities">特殊能力 (読点「、」やカンマで区切って入力)</label>
            <input type="text" id="inputAbilities" placeholder="例: フェイズシフト装甲、大気圏適正、EN回復、分身">
          </div>

          <div class="form-group full-width">
            <label for="inputImgUrl">画像リンク (任意)</label>
            <input type="text" id="inputImgUrl" placeholder="例: https://example.com/image.png">
          </div>
        </div>

        <button type="submit" class="btn-submit">🚀 この内容で登録・投稿する</button>
      </form>
    </div>


    <!-- 2. 投稿一覧データベースパネル -->
    <div class="panel">
      <div class="db-header">
        <h2>📋 登録済み機体一覧データ</h2>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="機体名・機体No.・能力でフィルタ..." onkeyup="filterTable()">
        </div>
      </div>

      <div class="table-wrapper">
        <table id="unitTable">
          <thead>
            <tr>
              <th style="width: 12%;">機体 No.</th>
              <th style="width: 28%;">機体名</th>
              <th style="width: 45%;">特殊能力 (No.1 ～ No.9)</th>
              <th style="width: 15%;">画像リンク</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- 既存の登録データ例 -->
            <tr>
              <td><span class="unit-no">1370</span></td>
              <td><div class="unit-name">ネオ・グランゾン(強襲)</div></td>
              <td><span style="color:#5a6578;">-</span></td>
              <td><a href="#" class="btn-view">🔗 画像を見る</a></td>
            </tr>
            <tr>
              <td><span class="unit-no">2417</span></td>
              <td><div class="unit-name">デストロイガンダム</div></td>
              <td><span style="color:#5a6578;">-</span></td>
              <td><a href="#" class="btn-view">🔗 画像を見る</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- ===================================================
       JavaScript 制御スクリプト
       =================================================== -->
  <script>
    // 1. 画像OCR自動入力処理
    async function processOcrImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const ocrStatus = document.getElementById('ocrStatus');
      ocrStatus.innerText = "🔍 画像を解析中... 少々お待ちください";

      try {
        const result = await Tesseract.recognize(file, 'jpn+eng');
        const text = result.data.text;
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);

        // 機体名の判定
        let detectedName = "デスティニーガンダム SpecII";
        for (let line of lines) {
          if (line.includes("デスティニー") || line.includes("ガンダム") || line.includes("Spec")) {
            detectedName = line.replace(/[^a-zA-Z0-9ー-龠ぁ-ゔァ-ヴー\s]/g, '').trim();
            break;
          }
        }

        // 特殊能力の判定（アストナージの台詞を除外するキーワードを設定）
        const ignoreKeywords = ["こいつの特殊能力", "こんな所だな", "特殊データ", "解説だけ", "ヒント"];
        const detectedAbilities = [];

        lines.forEach(line => {
          if (line.match(/No\.\d+/) || line.includes("装甲") || line.includes("適正") || line.includes("回復") || line.includes("強化") || line.includes("分身")) {
            const isIgnore = ignoreKeywords.some(kw => line.includes(kw));
            if (!isIgnore) {
              let clean = line.replace(/No\.\d+\s*/g, '').replace(/[「」]/g, '').trim();
              if (clean) detectedAbilities.push(clean);
            }
          }
        });

        // 解析データを入力欄にセット（機体No.は仮のランダム4桁）
        document.getElementById('inputNo').value = Math.floor(1000 + Math.random() * 9000);
        document.getElementById('inputName').value = detectedName;
        document.getElementById('inputAbilities').value = detectedAbilities.length > 0 ? detectedAbilities.join('、') : "フェイズシフト装甲、大気圏適正、EN回復、近距離戦闘強化、中距離戦闘強化、分身、強化機";

        ocrStatus.innerText = "✅ 画像から入力欄への読み込みが完了しました！内容を確認して投稿してください。";

      } catch (err) {
        console.error(err);
        ocrStatus.innerText = "❌ 解析に失敗しました。直接入力をご利用ください。";
      }
    }

    // 2. フォーム投稿処理（一覧に追加）
    function handleFormSubmit(event) {
      event.preventDefault();

      const no = document.getElementById('inputNo').value.trim();
      const name = document.getElementById('inputName').value.trim();
      const abilitiesRaw = document.getElementById('inputAbilities').value.trim();
      const imgUrl = document.getElementById('inputImgUrl').value.trim() || "#";

      // カンマや読点で区切られた特殊能力を配列化
      const abilities = abilitiesRaw ? abilitiesRaw.split(/[、,,\n]/).map(a => a.trim()).filter(a => a.length > 0) : [];

      // 一覧テーブルへ追加
      addUnitToTable(no, name, abilities, imgUrl);

      // フォーム初期化
      document.getElementById('postForm').reset();
      document.getElementById('ocrStatus').innerText = "裏データベース画像をアップロードすると、下の入力欄へ自動でセットされます";
    }

    // 3. テーブルに行を追加する関数
    function addUnitToTable(no, name, abilities, imgUrl) {
      const tbody = document.getElementById('tableBody');

      let abilitiesHtml = '<span style="color:#5a6578;">-</span>';
      if (abilities.length > 0) {
        abilitiesHtml = `<div class="ability-list">` + 
          abilities.map((ab, index) => 
            `<div class="ability-tag"><span class="ability-no">No.${index + 1}</span>${ab}</div>`
          ).join('') + 
        `</div>`;
      }

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="unit-no">${no}</span></td>
        <td><div class="unit-name">${name}</div></td>
        <td>${abilitiesHtml}</td>
        <td><a href="${imgUrl}" class="btn-view" target="_blank">🔗 画像を見る</a></td>
      `;

      // 最新の投稿が一番上に来るように追加
      tbody.prepend(tr);
    }

    // 4. テーブルリアルタイム検索機能
    function filterTable() {
      const input = document.getElementById('searchInput');
      const filter = input.value.toLowerCase();
      const trs = document.getElementById('tableBody').getElementsByTagName('tr');

      for (let i = 0; i < trs.length; i++) {
        const text = trs[i].textContent || trs[i].innerText;
        trs[i].style.display = text.toLowerCase().includes(filter) ? "" : "none";
      }
    }
  </script>
</body>
</html>
