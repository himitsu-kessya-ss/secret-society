<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Derivative Table - 秘密結社の部屋</title>
    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/scroller/2.2.0/css/scroller.dataTables.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/fixedcolumns/4.3.0/css/fixedColumns.dataTables.min.css">
    
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/scroller/2.2.0/js/dataTables.scroller.min.js"></script>
    <script src="https://cdn.datatables.net/fixedcolumns/4.3.0/js/dataTables.fixedColumns.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mark.js/8.11.1/jquery.mark.min.js"></script>

    <!-- 専用のCSSファイルを読み込み -->
    <link rel="stylesheet" href="derivatives.css">
</head>
<body>

    <!-- ▼ 共通ヘッダーが自動でここに読み込まれます -->
    <div id="header-container" style="width: 100%;"></div>

<div class="top-section">
    <div class="search-area">
        <input type="text" id="search-box" placeholder="機体名・NOで検索...">
    </div>
</div>

<div class="main-content">
    <table id="derivativeTable" class="display nowrap" style="width:100%"></table>
</div>

<!-- 共通ヘッダーを読み込んで現在地をアクティブにする処理 -->
<script>
    fetch('header.html')
        .then(response => response.text())
        .then(data => {
            document.getElementById('header-container').innerHTML = data;
            
            // 現在開いているページを自動判定してナビに active クラスをつける
            const currentPath = window.location.pathname.split('/').pop();
            const navLinks = document.querySelectorAll('.nav-links a');
            navLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
</script>

<script>
$(document).ready(function () {
    let table;

    fetch('derivatives.csv')
        .then(response => response.arrayBuffer())
        .then(buffer => {
            const decoder = new TextDecoder('shift-jis');
            const csvText = decoder.decode(buffer);
            
            // ヘッダーが重複（1, 2, 3...）しているため、列名の代わりに配列として読み込む
            const results = Papa.parse(csvText, {
                header: false, // ヘッダーを自動処理せず、手動で制御
                skipEmptyLines: true
            });

            if (results.data.length > 0) {
                initDataTable(results.data);
            }
        });

    function initDataTable(rawData) {
        // 1行目をヘッダーとして取得
        const headerRow = rawData[0];
        const bodyData = rawData.slice(1);

        // すべての列（J列以降のBG列までも含むすべて）を定義
        const columns = headerRow.map((title, index) => ({
            title: title || " ",
            data: index, // 列番号で紐付け
            orderable: false,
            defaultContent: ""
        }));

        table = $('#derivativeTable').DataTable({
            data: bodyData,
            columns: columns,
            deferRender: true,
            scrollY: "calc(100vh - 165px)",
            scrollX: true,
            scroller: true,
            dom: 'rti',
            ordering: false,
            fixedColumns: {
                left: 2 // NOと目的派生検索
            },
            language: { url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/ja.json" }
        });

        // 検索機能
        $('#search-box').on('input', function() {
            const keyword = $(this).val();
            table.search(keyword).draw();
            if (keyword.length > 0) {
                $('.dataTables_scrollBody').unmark().mark(keyword);
            }
        });
    }
});
</script>
<script data-goatcounter="https://bobs-base.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
