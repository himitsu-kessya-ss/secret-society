<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRIEFING ROOM - 団体戦作戦本部</title>
    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-card: #161f30;
            --accent: #00f0ff;
            --accent-green: #00ff88;
            --accent-warn: #ffaa00;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #24344d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 20px;
        }

        /* 共通コンテナ */
        .container { max-width: 1400px; margin: 0 auto; }
        .hidden { display: none !important; }

        /* ヘッダー */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }
        h1 { color: var(--accent); font-size: 1.8rem; letter-spacing: 2px; }
        .sub-title { color: var(--text-muted); font-size: 0.85rem; }

        /* ボタンデザイン */
        .btn {
            background-color: var(--bg-card);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: var(--accent);
            color: var(--bg-main);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .btn-secondary {
            border-color: var(--border);
            color: var(--text-muted);
        }
        .btn-secondary:hover {
            background-color: var(--border);
            color: #fff;
        }

        /* カード・コンテナ */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        /* イベントリスト (Briefing Room) */
        .event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .event-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: 6px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .event-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        /* タブ切替 (作戦メイン vs 要点サマリー) */
        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .tab-btn.active {
            background: var(--accent);
            color: var(--bg-main);
            border-color: var(--accent);
        }

        /* テーブル設定 */
        .table-responsive { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 1200px;
        }
        th, td {
            border: 1px solid var(--border);
            padding: 6px 8px;
            text-align: center;
        }
        th { background-color: #0d1522; color: var(--accent); font-weight: 600; }
        input, select {
            width: 100%;
            background: #0d1522;
            border: 1px solid var(--border);
            color: #fff;
            padding: 5px;
            border-radius: 3px;
        }
        input[type="checkbox"] { width: auto; transform: scale(1.2); }

        /* 射程レンジ用スパークラインバー */
        .range-bar-container {
            width: 100px;
            height: 12px;
            background: #0d1522;
            border: 1px solid var(--border);
            border-radius: 6px;
            position: relative;
            margin: 0 auto;
            overflow: hidden;
        }
        .range-bar-fill {
            position: absolute;
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-green));
            border-radius: 6px;
        }

        /* 要点サマリーカード */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }
        .summary-item-card {
            background: #0d1522;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 15px;
        }
        .summary-header {
            display: flex;
            justify-content: space-between;
            color: var(--accent);
            font-weight: bold;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        /* モーダル (PW入力・起票) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal {
            background: var(--bg-card);
            border: 1px solid var(--accent);
            padding: 25px;
            border-radius: 8px;
            width: 350px;
        }
        .modal input { margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <!-- ヘッダー -->
    <header>
        <div>
            <h1>BRIEFING ROOM</h1>
            <div class="sub-title">団体戦 作戦会議＆戦術プランニングツール</div>
        </div>
        <button id="btn-back-main" class="btn btn-secondary hidden" onclick="showMainPage()">← ブリーフィングルームへ戻る</button>
    </header>

    <!-- ========================================== -->
    <!-- ① メインページ: BRIEFING ROOM (イベント一覧) -->
    <!-- ========================================== -->
    <div id="page-briefing-room">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <h2>作戦イベント一覧</h2>
            <button class="btn" onclick="openCreateModal()">＋ 新規イベント起票（管理者）</button>
        </div>

        <div class="event-grid" id="event-list">
            <!-- 動的にイベントカードが追加されます -->
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ② 配下ページ: イベント別 作戦シート -->
    <!-- ========================================== -->
    <div id="page-event-sheet" class="hidden">
        <div class="card">
            <h2 id="sheet-event-title" style="color: var(--accent); margin-bottom: 5px;">-</h2>
            <p id="sheet-event-desc" class="sub-title">-</p>
        </div>

        <!-- タブナビゲーション -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('plan')">⚔️ 作戦立案（メイン）</button>
            <button class="tab-btn" onclick="switchTab('member')">👤 参加メンバー・階級設定</button>
            <button class="tab-btn" onclick="switchTab('summary')">📋 作戦要点サマリー（参照用）</button>
        </div>

        <!-- TAB 1: 作戦立案メイン -->
        <div id="tab-plan" class="tab-content">
            <div class="card" style="margin-bottom: 15px; display: flex; gap: 20px; align-items: center;">
                <div>登録数: <span id="stat-count" style="color:var(--accent); font-weight:bold;">0</span> / 9</div>
                <div>合計HP: <span id="stat-hp" style="color:var(--accent-green); font-weight:bold;">0</span></div>
                <div>合計コスト: <span id="stat-cost" style="color:var(--accent-warn); font-weight:bold;">0</span></div>
            </div>

            <div class="table-responsive card">
                <table>
                    <thead>
                        <tr>
                            <th>登録</th>
                            <th>No</th>
                            <th>団体戦術</th>
                            <th>ターン</th>
                            <th>プレイヤー名</th>
                            <th>機体名</th>
                            <th>目安コスト</th>
                            <th>HP</th>
                            <th>武器</th>
                            <th>射程（視覚化）</th>
                            <th>装備</th>
                            <th>個人戦術</th>
                            <th>特性1</th>
                            <th>特性2</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-tactics">
                        <!-- 動的に作戦行が追加されます -->
                    </tbody>
                </table>
                <button class="btn" style="margin-top: 15px;" onclick="addTacticsRow()">＋ メンバー枠を追加</button>
            </div>
        </div>

        <!-- TAB 2: 参加メンバー・階級設定 -->
        <div id="tab-member" class="tab-content hidden">
            <div class="card">
                <h3>このイベント時点のプレイヤー情報</h3>
                <p class="sub-title" style="margin-bottom: 15px;">ここで設定した階級に基づき加算コストが自動更新されます。</p>
                <div class="table-responsive">
                    <table style="min-width: 600px; max-width: 800px;">
                        <thead>
                            <tr>
                                <th>プレイヤー名</th>
                                <th>熟練度</th>
                                <th>階級</th>
                                <th>加算コスト</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-members">
                            <!-- メンバー階級設定行 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- TAB 3: 作戦要点サマリー -->
        <div id="tab-summary" class="tab-content hidden">
            <div class="card">
                <h3 style="margin-bottom: 15px;">🎯 登録メンバーの作戦要点</h3>
                <div class="summary-grid" id="summary-cards">
                    <!-- 要点カードが動的に生成されます -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- モーダルダイアログ (PW入力 / イベント起票) -->
<!-- ========================================== -->
<div id="modal-overlay" class="modal-overlay hidden">
    <!-- 管理者起票モーダル -->
    <div id="modal-create" class="modal hidden">
        <h3>新規イベント起票</h3>
        <p class="sub-title">管理者パスワードを入力してください。</p>
        <input type="password" id="input-admin-pw" placeholder="管理者パスワード">
        <input type="text" id="input-event-title" placeholder="イベント名 (例: 10月勢力戦)">
        <input type="password" id="input-event-pw" placeholder="入室用パスワード設定">
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
            <button class="btn" onclick="submitCreateEvent()">起票する</button>
        </div>
    </div>

    <!-- 入室PWモーダル -->
    <div id="modal-auth" class="modal hidden">
        <h3 id="auth-event-title">イベント入室</h3>
        <p class="sub-title">開示された入室パスワードを入力してください。</p>
        <input type="password" id="input-auth-pw" placeholder="入室パスワード">
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn btn-secondary" onclick="closeModal()">キャンセル</button>
            <button class="btn" onclick="submitAuthEvent()">入室</button>
        </div>
    </div>
</div>

<script>
    // ----------------------------------------------------
    // マスタデータ（スプレッドシートより抽出）
    // ----------------------------------------------------
    const RANK_MASTER = {
        "民間人": 0, "志願兵": 1, "二等兵": 2, "一等兵": 3, "上等兵": 4, "兵長": 5,
        "上級兵長": 6, "伍長": 7, "上級伍長": 8, "軍曹": 9, "上級軍曹": 10, "先任軍曹": 11,
        "曹長": 12, "上級曹長": 13, "先任曹長": 14, "准尉": 15, "上級准尉": 16, "特務准尉": 17,
        "少尉": 18, "中尉": 19, "上級中尉": 20, "大尉": 21, "特務大尉": 22, "戦術大尉": 23,
        "少佐": 24, "作戦少佐": 25, "特殊作戦少佐": 26, "中佐": 27, "特務中佐": 28, "大佐": 29, "準将": 30
    };

    const TACTICS_MASTER = ["NS", "AS", "DS", "SS", "NA", "AA", "DA", "SA", "ND", "AD", "DD", "SD", "LA", "LD", "LS"];

    // 機体データベース（サンプル抽出）
    const MECHA_DB = {
        "ガンダム": { hp: 384, cost: 38 },
        "バンシィ": { hp: 576, cost: 64 },
        "Zガンダム": { hp: 448, cost: 52 },
        "ペルフェクティビリティ": { hp: 640, cost: 62 },
        "ガリルナガン": { hp: 700, cost: 72 },
        "デスティニーガンダムSpecII": { hp: 548, cost: 73 },
        "ヒュッケバインMk-IIトロンベ": { hp: 468, cost: 53 },
        "バルバタウロス": { hp: 1038, cost: 85 }
    };

    // ----------------------------------------------------
    // アプリケーション状態管理
    // ----------------------------------------------------
    let events = [
        { id: 'ev1', title: '26.10 勢力戦', pass: '1234', members: {}, tactics: [] }
    ];
    let currentEventId = null;

    // デフォルトの初期プレイヤーリスト
    const DEFAULT_PLAYERS = ["Oro🍊min", "Halbert", "Yggdrasill", "スパイク", "キッド", "ボブ", "リーア", "ハチワレ", "ナイト"];

    // 初期化
    window.onload = function() {
        initDefaultEventData(events[0]);
        renderEventList();
    };

    function initDefaultEventData(ev) {
        DEFAULT_PLAYERS.forEach((p, idx) => {
            ev.members[p] = { exp: 150 + idx * 10, rank: "曹長" };
        });
        ev.members["Oro🍊min"] = { exp: 294, rank: "特務准尉" };
        ev.members["Halbert"] = { exp: 265, rank: "先任曹長" };

        ev.tactics = [
            { reg: true, tactic: "DA", turn: 10, player: "Oro🍊min", mecha: "ガンダム", weapon: "★フルバースト", minR: 20, maxR: 70, equip: "プロペラントタンク", str: "移動しない攻撃", t1: "集中10", t2: "機転10" },
            { reg: true, tactic: "DA", turn: 1, player: "Yggdrasill", mecha: "ガリルナガン", weapon: "アキシオン・アッシャー", minR: 50, maxR: 90, equip: "プロペラントタンク", str: "足止め攻撃", t1: "集中10", t2: "繊細10" }
        ];
    }

    // ----------------------------------------------------
    // メインページ（ブリーフィングルーム）制御
    // ----------------------------------------------------
    function renderEventList() {
        const listEl = document.getElementById('event-list');
        listEl.innerHTML = '';
        events.forEach(ev => {
            const card = document.createElement('div');
            card.className = 'event-card';
            card.onclick = () => openAuthModal(ev.id);
            card.innerHTML = `
                <h3>${ev.title}</h3>
                <p class="sub-title" style="margin-top:8px;">🔒 要パスワード保護</p>
            `;
            listEl.appendChild(card);
        });
    }

    function showMainPage() {
        document.getElementById('page-briefing-room').classList.remove('hidden');
        document.getElementById('page-event-sheet').classList.add('hidden');
        document.getElementById('btn-back-main').classList.add('hidden');
        currentEventId = null;
    }

    // ----------------------------------------------------
    // モーダル・認証処理
    // ----------------------------------------------------
    function closeModal() {
        document.getElementById('modal-overlay').classList.add('hidden');
        document.getElementById('modal-create').classList.add('hidden');
        document.getElementById('modal-auth').classList.add('hidden');
    }

    function openCreateModal() {
        document.getElementById('input-admin-pw').value = '';
        document.getElementById('input-event-title').value = '';
        document.getElementById('input-event-pw').value = '';
        document.getElementById('modal-overlay').classList.remove('hidden');
        document.getElementById('modal-create').classList.remove('hidden');
    }

    function submitCreateEvent() {
        const adminPw = document.getElementById('input-admin-pw').value;
        const title = document.getElementById('input-event-title').value;
        const eventPw = document.getElementById('input-event-pw').value;

        if (adminPw !== 'p@ssw0rd') {
            alert('管理者パスワードが正しくありません。');
            return;
        }
        if (!title || !eventPw) {
            alert('イベント名と入室パスワードを入力してください。');
            return;
        }

        const newEv = {
            id: 'ev_' + Date.now(),
            title: title,
            pass: eventPw,
            members: {},
            tactics: []
        };
        initDefaultEventData(newEv);
        events.push(newEv);
        renderEventList();
        closeModal();
        alert('新規イベントを起票しました！');
    }

    function openAuthModal(evId) {
        currentEventId = evId;
        const ev = events.find(e => e.id === evId);
        document.getElementById('auth-event-title').innerText = ev.title;
        document.getElementById('input-auth-pw').value = '';
        document.getElementById('modal-overlay').classList.remove('hidden');
        document.getElementById('modal-auth').classList.remove('hidden');
    }

    function submitAuthEvent() {
        const inputPw = document.getElementById('input-auth-pw').value;
        const ev = events.find(e => e.id === currentEventId);

        if (ev && inputPw === ev.pass) {
            closeModal();
            loadEventSheet(ev);
        } else {
            alert('パスワードが正しくありません。');
        }
    }

    // ----------------------------------------------------
    // イベントシート画面 処理
    // ----------------------------------------------------
    function loadEventSheet(ev) {
        document.getElementById('page-briefing-room').classList.add('hidden');
        document.getElementById('page-event-sheet').classList.remove('hidden');
        document.getElementById('btn-back-main').classList.remove('hidden');

        document.getElementById('sheet-event-title').innerText = ev.title;
        document.getElementById('sheet-event-desc').innerText = `イベントID: ${ev.id} | 作戦共有中`;

        renderMemberTable(ev);
        renderTacticsTable(ev);
        switchTab('plan');
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.add('hidden'));

        if (tabName === 'plan') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-plan').classList.remove('hidden');
        } else if (tabName === 'member') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-member').classList.remove('hidden');
        } else if (tabName === 'summary') {
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.getElementById('tab-summary').classList.remove('hidden');
            renderSummaryCards();
        }
    }

    // TAB 2: メンバー階級設定 テーブル描画
    function renderMemberTable(ev) {
        const tbody = document.getElementById('tbody-members');
        tbody.innerHTML = '';

        Object.keys(ev.members).forEach(pName => {
            const m = ev.members[pName];
            const rankCost = RANK_MASTER[m.rank] || 0;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${pName}</strong></td>
                <td><input type="number" value="${m.exp}" onchange="ev.members['${pName}'].exp = this.value"></td>
                <td>
                    <select onchange="updateMemberRank('${pName}', this.value)">
                        ${Object.keys(RANK_MASTER).map(r => `<option value="${r}" ${r === m.rank ? 'selected' : ''}>${r}</option>`).join('')}
                    </select>
                </td>
                <td style="color:var(--accent); font-weight:bold;">+${rankCost}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function updateMemberRank(pName, newRank) {
        const ev = events.find(e => e.id === currentEventId);
        ev.members[pName].rank = newRank;
        renderMemberTable(ev);
        renderTacticsTable(ev);
    }

    // TAB 1: 作戦立案メイン テーブル描画
    function renderTacticsTable(ev) {
        const tbody = document.getElementById('tbody-tactics');
        tbody.innerHTML = '';

        ev.tactics.forEach((row, idx) => {
            const tr = createTacticsTr(row, idx + 1, ev);
            tbody.appendChild(tr);
        });

        calculateStats();
    }

    function addTacticsRow() {
        const ev = events.find(e => e.id === currentEventId);
        ev.tactics.push({
            reg: false, tactic: "AA", turn: 1, player: "", mecha: "", weapon: "", minR: 0, maxR: 20, equip: "", str: "", t1: "", t2: ""
        });
        renderTacticsTable(ev);
    }

    function createTacticsTr(row, no, ev) {
        const tr = document.createElement('tr');

        const playerRank = ev.members[row.player] ? ev.members[row.player].rank : null;
        const addCost = playerRank ? (RANK_MASTER[playerRank] || 0) : 0;
        const mechaData = MECHA_DB[row.mecha] || { hp: 0, cost: 0 };
        const totalCost = (row.mecha ? mechaData.cost : 0) + addCost;

        tr.innerHTML = `
            <td><input type="checkbox" ${row.reg ? 'checked' : ''} onchange="row.reg = this.checked; calculateStats();"></td>
            <td>${no}</td>
            <td>
                <select onchange="row.tactic = this.value">
                    ${TACTICS_MASTER.map(t => `<option value="${t}" ${t === row.tactic ? 'selected' : ''}>${t}</option>`).join('')}
                </select>
            </td>
            <td><input type="number" value="${row.turn}" style="width:45px;" onchange="row.turn = this.value"></td>
            <td>
                <select onchange="row.player = this.value; renderTacticsTable(ev);">
                    <option value="">選択</option>
                    ${Object.keys(ev.members).map(p => `<option value="${p}" ${p === row.player ? 'selected' : ''}>${p}</option>`).join('')}
                </select>
            </td>
            <td>
                <select onchange="row.mecha = this.value; renderTacticsTable(ev);">
                    <option value="">選択</option>
                    ${Object.keys(MECHA_DB).map(m => `<option value="${m}" ${m === row.mecha ? 'selected' : ''}>${m}</option>`).join('')}
                </select>
            </td>
            <td style="color:var(--accent); font-weight:bold;">${totalCost || '-'}</td>
            <td><input type="number" value="${row.mecha ? mechaData.hp : 0}" style="width:60px;"></td>
            <td><input type="text" value="${row.weapon}" onchange="row.weapon = this.value"></td>
            <td>
                <div style="display:flex; gap:2px; align-items:center;">
                    <input type="number" value="${row.minR}" style="width:35px;" onchange="row.minR = Number(this.value); renderTacticsTable(ev);">
                    <span>-</span>
                    <input type="number" value="${row.maxR}" style="width:35px;" onchange="row.maxR = Number(this.value); renderTacticsTable(ev);">
                </div>
                <div class="range-bar-container" style="margin-top:3px;">
                    <div class="range-bar-fill" style="left: ${row.minR}%; width: ${Math.max(0, row.maxR - row.minR)}%;"></div>
                </div>
            </td>
            <td><input type="text" value="${row.equip}" onchange="row.equip = this.value"></td>
            <td><input type="text" value="${row.str}" onchange="row.str = this.value"></td>
            <td><input type="text" value="${row.t1}" onchange="row.t1 = this.value"></td>
            <td><input type="text" value="${row.t2}" onchange="row.t2 = this.value"></td>
        `;

        return tr;
    }

    function calculateStats() {
        const ev = events.find(e => e.id === currentEventId);
        if (!ev) return;

        let count = 0, totalHp = 0, totalCost = 0;

        ev.tactics.forEach(r => {
            if (r.reg) {
                count++;
                const mechaData = MECHA_DB[r.mecha] || { hp: 0, cost: 0 };
                const playerRank = ev.members[r.player] ? ev.members[r.player].rank : null;
                const addCost = playerRank ? (RANK_MASTER[playerRank] || 0) : 0;

                totalHp += mechaData.hp;
                totalCost += (r.mecha ? mechaData.cost : 0) + addCost;
            }
        });

        document.getElementById('stat-count').innerText = count;
        document.getElementById('stat-hp').innerText = totalHp.toLocaleString();
        document.getElementById('stat-cost').innerText = totalCost.toLocaleString();
    }

    // TAB 3: 要点サマリーカード描画
    function renderSummaryCards() {
        const ev = events.find(e => e.id === currentEventId);
        const container = document.getElementById('summary-cards');
        container.innerHTML = '';

        const activeRows = ev.tactics.filter(r => r.reg);
        if (activeRows.length === 0) {
            container.innerHTML = '<p class="sub-title">登録にチェックが入っている機体がありません。</p>';
            return;
        }

        activeRows.forEach(r => {
            const card = document.createElement('div');
            card.className = 'summary-item-card';
            card.innerHTML = `
                <div class="summary-header">
                    <span>${r.player || '未設定'} (${r.tactic})</span>
                    <span>T: ${r.turn}</span>
                </div>
                <div><strong>機体:</strong> ${r.mecha || '-'}</div>
                <div><strong>武装:</strong> ${r.weapon || '-'} (射程: ${r.minR}〜${r.maxR})</div>
                <div><strong>装備:</strong> ${r.equip || '-'}</div>
                <div style="margin-top:8px; color:var(--text-muted); font-size:0.8rem;">
                    個人戦術: ${r.str || '-'} / 特性: ${r.t1 || '-'}, ${r.t2 || '-'}
                </div>
            `;
            container.appendChild(card);
        });
    }
</script>
</body>
</html>
